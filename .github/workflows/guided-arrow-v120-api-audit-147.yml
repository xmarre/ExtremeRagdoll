name: Temporary Guided Arrow v1.0.20 API Audit 1.4.7

on:
  pull_request:
    paths:
      - '.github/workflows/guided-arrow-v120-api-audit-147.yml'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download exact successful v1.0.20 artifact
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{
            Authorization="Bearer $env:GITHUB_TOKEN"
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
          }
          Invoke-WebRequest -Uri 'https://api.github.com/repos/xmarre/ExtremeRagdoll/actions/artifacts/8607961542/zip' -Headers $headers -OutFile 'v120artifact.zip'
          Expand-Archive 'v120artifact.zip' 'work' -Force
          if(-not (Test-Path 'work/Source/GuidedArrow.csproj')){throw 'v1.0.20 source missing from artifact'}

      - name: Verify exact v1.0.20 source baseline
        shell: pwsh
        run: |
          @'
          import hashlib,pathlib
          root=pathlib.Path('work/Source');h=hashlib.sha256()
          for p in sorted(x for x in root.rglob('*') if x.is_file() and 'obj' not in x.parts and 'bin' not in x.parts):
              rel=p.relative_to(root).as_posix().encode();h.update(rel);h.update(b'\0');h.update(p.read_bytes());h.update(b'\0')
          d=h.hexdigest();print('v120_source_sha256='+d);assert d=='964d214fc8fc5f0e3d03294c8b3db69f05e02720b3ccd817a94357743301d686'
          '@ | Set-Content -Encoding UTF8 verify120.py
          python verify120.py

      - name: Retarget only Bannerlord compile references to 1.4.7
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p='work/Source/GuidedArrow.csproj'
          $s=Get-Content $p -Raw
          if(-not $s.Contains('1.3.15.110062')){throw 'Expected 1.3.15 reference version not found'}
          $s=$s.Replace('1.3.15.110062','1.4.7.117484')
          Set-Content -Path $p -Value $s -Encoding UTF8
          Select-String -Path $p -Pattern '1.4.7.117484' | ForEach-Object { $_.Line }

      - name: Restore 1.4.7 references
        shell: pwsh
        run: dotnet restore 'work/Source/GuidedArrow.csproj'

      - name: Build unchanged source against 1.4.7
        shell: pwsh
        run: |
          dotnet build 'work/Source/GuidedArrow.csproj' -c Release --no-restore 2>&1 | Tee-Object -FilePath compiler-147.log
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}

      - name: Collect audit outputs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force audit | Out-Null
          if(Test-Path 'compiler-147.log'){Copy-Item compiler-147.log audit/compiler-147.log}
          if(Test-Path 'work/Source/GuidedArrow.csproj'){Copy-Item 'work/Source/GuidedArrow.csproj' audit/GuidedArrow-147.csproj}
          if(Test-Path 'work/Source/bin/Release/net472/GuidedArrow.dll'){Copy-Item 'work/Source/bin/Release/net472/GuidedArrow.dll' audit/GuidedArrow-147-test.dll}

      - name: Upload audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GuidedArrow-v1.0.20-api-audit-1.4.7
          path: audit
          if-no-files-found: warn
