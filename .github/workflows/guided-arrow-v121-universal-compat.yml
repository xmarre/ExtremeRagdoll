name: Temporary Guided Arrow v1.0.21 Universal Compatibility Build

on:
  pull_request:
    paths:
      - '.github/workflows/guided-arrow-v121-universal-compat.yml'

permissions:
  contents: read
  actions: read

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download exact successful v1.0.20 artifact
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{
            Authorization="Bearer $env:GITHUB_TOKEN"
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
          }
          Invoke-WebRequest -Uri 'https://api.github.com/repos/xmarre/ExtremeRagdoll/actions/artifacts/8607961542/zip' -Headers $headers -OutFile 'v120artifact.zip'
          Expand-Archive 'v120artifact.zip' 'work' -Force
          if(-not (Test-Path 'work/Source/GuidedArrow.csproj')){throw 'v1.0.20 source missing'}
          if(-not (Test-Path 'work/SubModule.xml')){throw 'v1.0.20 SubModule.xml missing'}

      - name: Verify exact v1.0.20 source baseline
        shell: pwsh
        run: |
          @'
          import hashlib,pathlib
          root=pathlib.Path('work/Source');h=hashlib.sha256()
          for p in sorted(x for x in root.rglob('*') if x.is_file() and 'obj' not in x.parts and 'bin' not in x.parts):
              rel=p.relative_to(root).as_posix().encode();h.update(rel);h.update(b'\0');h.update(p.read_bytes());h.update(b'\0')
          d=h.hexdigest();print('v120_source_sha256='+d);assert d=='964d214fc8fc5f0e3d03294c8b3db69f05e02720b3ccd817a94357743301d686'
          '@ | Set-Content -Encoding UTF8 verify120.py
          python verify120.py

      - name: Apply universal v1.0.21 release metadata only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p='work/Source/GuidedArrow.csproj'
          $s=Get-Content $p -Raw
          foreach($n in @('<Version>1.0.20</Version>','<FileVersion>1.0.20.0</FileVersion>','<AssemblyVersion>1.0.20.0</AssemblyVersion>')){if(-not $s.Contains($n)){throw "Missing $n"}}
          $s=$s.Replace('<Version>1.0.20</Version>','<Version>1.0.21</Version>')
          $s=$s.Replace('<FileVersion>1.0.20.0</FileVersion>','<FileVersion>1.0.21.0</FileVersion>')
          $s=$s.Replace('<AssemblyVersion>1.0.20.0</AssemblyVersion>','<AssemblyVersion>1.0.21.0</AssemblyVersion>')
          Set-Content -Path $p -Value $s -Encoding UTF8
          $p='work/SubModule.xml'
          $s=Get-Content $p -Raw
          if(-not $s.Contains('<Version value="v1.0.20" />')){throw 'SubModule baseline version missing'}
          $s=$s.Replace('<Version value="v1.0.20" />','<Version value="v1.0.21" />')
          Set-Content -Path $p -Value $s -Encoding UTF8

      - name: Verify exact v1.0.21 source and oldest-reference invariant
        shell: pwsh
        run: |
          @'
          import hashlib,pathlib
          root=pathlib.Path('work/Source');h=hashlib.sha256()
          for p in sorted(x for x in root.rglob('*') if x.is_file() and 'obj' not in x.parts and 'bin' not in x.parts):
              rel=p.relative_to(root).as_posix().encode();h.update(rel);h.update(b'\0');h.update(p.read_bytes());h.update(b'\0')
          d=h.hexdigest();print('v121_source_sha256='+d);assert d=='b10f6aad6f4e30cd34b758a4b63c6c98911c8dfc75b6ced7a7215ace2fe9db3d'
          pathlib.Path('source_hash.txt').write_text(d+'\n')
          cs=(root/'GuidedArrow.csproj').read_text()
          assert '1.3.15.110062' in cs
          assert '1.4.7.117484' not in cs
          '@ | Set-Content -Encoding UTF8 verify121.py
          python verify121.py

      - name: Restore production references
        shell: pwsh
        run: dotnet restore 'work/Source/GuidedArrow.csproj'

      - name: Build production DLL against oldest supported API 1.3.15
        shell: pwsh
        run: |
          dotnet build 'work/Source/GuidedArrow.csproj' -c Release --no-restore 2>&1 | Tee-Object -FilePath compiler-release.log
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}

      - name: Collect exact release outputs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item 'work/Source/bin/Release/net472/GuidedArrow.dll' release/GuidedArrow.dll
          Copy-Item 'work/Source/bin/Release/net472/GuidedArrow.pdb' release/GuidedArrow.pdb
          Copy-Item 'work/Source' release/Source -Recurse
          Remove-Item 'release/Source/bin','release/Source/obj' -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item 'work/SubModule.xml' release/SubModule.xml
          Copy-Item compiler-release.log release/compiler-release.log
          Copy-Item source_hash.txt release/source_hash.txt
          Get-FileHash release/GuidedArrow.dll -Algorithm SHA256 | Format-List | Out-File release/dll_hash.txt
          Get-FileHash release/GuidedArrow.pdb -Algorithm SHA256 | Format-List | Out-File release/pdb_hash.txt

      - name: Upload production outputs
        uses: actions/upload-artifact@v4
        with:
          name: GuidedArrow-v1.0.21-production-oldest-api
          path: release
          if-no-files-found: error

  compatibility:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        bannerlord:
          - '1.3.15.110062'
          - '1.4.0.112726-beta'
          - '1.4.1.113228-beta'
          - '1.4.2.113809-beta'
          - '1.4.3.114169-beta'
          - '1.4.4.114449-beta'
          - '1.4.5.115026'
          - '1.4.6.115628'
          - '1.4.7.117484'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download exact successful v1.0.20 artifact
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{
            Authorization="Bearer $env:GITHUB_TOKEN"
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
          }
          Invoke-WebRequest -Uri 'https://api.github.com/repos/xmarre/ExtremeRagdoll/actions/artifacts/8607961542/zip' -Headers $headers -OutFile 'v120artifact.zip'
          Expand-Archive 'v120artifact.zip' 'work' -Force

      - name: Verify baseline and prepare identical v1.0.21 source for ${{ matrix.bannerlord }}
        shell: pwsh
        env:
          TARGET_VERSION: ${{ matrix.bannerlord }}
        run: |
          $ErrorActionPreference='Stop'
          @'
          import hashlib,pathlib
          root=pathlib.Path('work/Source');h=hashlib.sha256()
          for p in sorted(x for x in root.rglob('*') if x.is_file() and 'obj' not in x.parts and 'bin' not in x.parts):
              rel=p.relative_to(root).as_posix().encode();h.update(rel);h.update(b'\0');h.update(p.read_bytes());h.update(b'\0')
          assert h.hexdigest()=='964d214fc8fc5f0e3d03294c8b3db69f05e02720b3ccd817a94357743301d686'
          '@ | Set-Content -Encoding UTF8 verifybase.py
          python verifybase.py
          $p='work/Source/GuidedArrow.csproj'
          $s=Get-Content $p -Raw
          $s=$s.Replace('<Version>1.0.20</Version>','<Version>1.0.21</Version>')
          $s=$s.Replace('<FileVersion>1.0.20.0</FileVersion>','<FileVersion>1.0.21.0</FileVersion>')
          $s=$s.Replace('<AssemblyVersion>1.0.20.0</AssemblyVersion>','<AssemblyVersion>1.0.21.0</AssemblyVersion>')
          if($env:TARGET_VERSION -ne '1.3.15.110062'){$s=$s.Replace('1.3.15.110062',$env:TARGET_VERSION)}
          Set-Content -Path $p -Value $s -Encoding UTF8

      - name: Restore ${{ matrix.bannerlord }} references
        shell: pwsh
        run: dotnet restore 'work/Source/GuidedArrow.csproj'

      - name: Compile identical source against ${{ matrix.bannerlord }}
        shell: pwsh
        run: |
          dotnet build 'work/Source/GuidedArrow.csproj' -c Release --no-restore 2>&1 | Tee-Object -FilePath 'compiler-${{ matrix.bannerlord }}.log'
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}

      - name: Upload compatibility compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-${{ matrix.bannerlord }}
          path: compiler-${{ matrix.bannerlord }}.log
          if-no-files-found: warn
