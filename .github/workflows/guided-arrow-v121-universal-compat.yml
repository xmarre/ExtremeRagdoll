name: Temporary Guided Arrow v1.0.21 Universal Compatibility Build

on:
  pull_request:
    paths: ['.github/workflows/guided-arrow-v121-universal-compat.yml']

permissions:
  contents: read
  actions: read

env:
  BASE_ARTIFACT: '8607961542'
  BASE_SOURCE_SHA: '964d214fc8fc5f0e3d03294c8b3db69f05e02720b3ccd817a94357743301d686'
  RELEASE_SOURCE_SHA: '316e7d0116b542ca25334ee8a28c7323e527e6e14e7cf1f97388b1d6909e7875'

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Download exact v1.0.20 baseline
        shell: pwsh
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: |
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-WebRequest -Uri "https://api.github.com/repos/xmarre/ExtremeRagdoll/actions/artifacts/$env:BASE_ARTIFACT/zip" -Headers $h -OutFile base.zip
          Expand-Archive base.zip work -Force
      - name: Verify baseline and apply metadata-only v1.0.21 bump
        shell: pwsh
        run: |
          @'
          import hashlib,pathlib
          root=pathlib.Path('work/Source')
          def treehash():
              h=hashlib.sha256()
              for p in sorted(x for x in root.rglob('*') if x.is_file() and 'obj' not in x.parts and 'bin' not in x.parts):
                  h.update(p.relative_to(root).as_posix().encode());h.update(b'\0');h.update(p.read_bytes());h.update(b'\0')
              return h.hexdigest()
          before=treehash();print('baseline='+before);assert before=='964d214fc8fc5f0e3d03294c8b3db69f05e02720b3ccd817a94357743301d686'
          p=root/'GuidedArrow.csproj';b=p.read_bytes()
          reps=[(b'<Version>1.0.20</Version>',b'<Version>1.0.21</Version>'),(b'<FileVersion>1.0.20.0</FileVersion>',b'<FileVersion>1.0.21.0</FileVersion>'),(b'<AssemblyVersion>1.0.20.0</AssemblyVersion>',b'<AssemblyVersion>1.0.21.0</AssemblyVersion>')]
          for a,c in reps: assert a in b;b=b.replace(a,c)
          p.write_bytes(b)
          p=pathlib.Path('work/SubModule.xml');b=p.read_bytes();a=b'<Version value="v1.0.20" />';assert a in b;p.write_bytes(b.replace(a,b'<Version value="v1.0.21" />'))
          after=treehash();print('release='+after);assert after=='316e7d0116b542ca25334ee8a28c7323e527e6e14e7cf1f97388b1d6909e7875'
          pathlib.Path('source_hash.txt').write_text(after+'\n')
          cs=(root/'GuidedArrow.csproj').read_text();assert '1.3.15.110062' in cs and '1.4.7.117484' not in cs
          '@ | Set-Content -Encoding UTF8 prepare.py
          python prepare.py
      - name: Build production DLL against oldest supported API 1.3.15
        shell: pwsh
        run: |
          dotnet restore work/Source/GuidedArrow.csproj
          dotnet build work/Source/GuidedArrow.csproj -c Release --no-restore 2>&1 | Tee-Object compiler-release.log
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
      - name: Collect production outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item work/Source/bin/Release/net472/GuidedArrow.dll release/GuidedArrow.dll
          Copy-Item work/Source/bin/Release/net472/GuidedArrow.pdb release/GuidedArrow.pdb
          Copy-Item work/Source release/Source -Recurse
          Remove-Item release/Source/bin,release/Source/obj -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item work/SubModule.xml release/SubModule.xml
          Copy-Item source_hash.txt,compiler-release.log release/
          (Get-FileHash release/GuidedArrow.dll -Algorithm SHA256).Hash.ToLower() | Set-Content release/dll_sha256.txt
          (Get-FileHash release/GuidedArrow.pdb -Algorithm SHA256).Hash.ToLower() | Set-Content release/pdb_sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GuidedArrow-v1.0.21-production-oldest-api
          path: release
          if-no-files-found: error

  compatibility:
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        bannerlord: ['1.3.15.110062','1.4.0.112726-beta','1.4.1.113228-beta','1.4.2.113809-beta','1.4.3.114169-beta','1.4.4.114449-beta','1.4.5.115026','1.4.6.115628','1.4.7.117484']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Download exact v1.0.20 baseline
        shell: pwsh
        env: { GITHUB_TOKEN: '${{ github.token }}' }
        run: |
          $h=@{Authorization="Bearer $env:GITHUB_TOKEN";Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'}
          Invoke-WebRequest -Uri "https://api.github.com/repos/xmarre/ExtremeRagdoll/actions/artifacts/$env:BASE_ARTIFACT/zip" -Headers $h -OutFile base.zip
          Expand-Archive base.zip work -Force
      - name: Prepare identical code for ${{ matrix.bannerlord }} API compile
        shell: pwsh
        env: { TARGET_VERSION: '${{ matrix.bannerlord }}' }
        run: |
          @'
          import hashlib,os,pathlib
          root=pathlib.Path('work/Source');h=hashlib.sha256()
          for p in sorted(x for x in root.rglob('*') if x.is_file() and 'obj' not in x.parts and 'bin' not in x.parts):
              h.update(p.relative_to(root).as_posix().encode());h.update(b'\0');h.update(p.read_bytes());h.update(b'\0')
          assert h.hexdigest()=='964d214fc8fc5f0e3d03294c8b3db69f05e02720b3ccd817a94357743301d686'
          p=root/'GuidedArrow.csproj';b=p.read_bytes()
          for a,c in [(b'<Version>1.0.20</Version>',b'<Version>1.0.21</Version>'),(b'<FileVersion>1.0.20.0</FileVersion>',b'<FileVersion>1.0.21.0</FileVersion>'),(b'<AssemblyVersion>1.0.20.0</AssemblyVersion>',b'<AssemblyVersion>1.0.21.0</AssemblyVersion>')]: assert a in b;b=b.replace(a,c)
          target=os.environ['TARGET_VERSION'].encode()
          if target!=b'1.3.15.110062': b=b.replace(b'1.3.15.110062',target)
          p.write_bytes(b)
          '@ | Set-Content -Encoding UTF8 prepare-compat.py
          python prepare-compat.py
      - name: Compile against ${{ matrix.bannerlord }}
        shell: pwsh
        run: |
          dotnet restore work/Source/GuidedArrow.csproj
          dotnet build work/Source/GuidedArrow.csproj -c Release --no-restore 2>&1 | Tee-Object 'compiler-${{ matrix.bannerlord }}.log'
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
      - name: Upload compatibility log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-${{ matrix.bannerlord }}
          path: compiler-${{ matrix.bannerlord }}.log
          if-no-files-found: warn
