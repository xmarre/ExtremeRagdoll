name: Temporary Guided Arrow v1.0.20 Compiler

on:
  push:
    branches:
      - 'tmp/guided-arrow-v120-native-crosshair-fix'
    paths:
      - '.github/workflows/guided-arrow-v120-compiler.yml'
      - 'GuidedArrow/v120_apply.py.gz.b64'
      - 'GuidedArrow/.v120-compile-trigger'
  pull_request:
    paths:
      - '.github/workflows/guided-arrow-v120-compiler.yml'
      - 'GuidedArrow/v120_apply.py.gz.b64'
      - 'GuidedArrow/.v120-compile-trigger'

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download exact successful v1.0.19 compiler artifact
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $headers=@{
            Authorization="Bearer $env:GITHUB_TOKEN"
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
          }
          Invoke-WebRequest -Uri 'https://api.github.com/repos/xmarre/ExtremeRagdoll/actions/artifacts/8606689441/zip' -Headers $headers -OutFile 'v119artifact.zip'
          Expand-Archive 'v119artifact.zip' 'work' -Force
          if(-not (Test-Path 'work/Source/GuidedArrow.csproj')){throw 'v1.0.19 source missing from artifact'}
          if(-not (Test-Path 'work/SubModule.xml')){throw 'v1.0.19 SubModule.xml missing from artifact'}

      - name: Verify exact v1.0.19 source baseline
        shell: pwsh
        run: |
          @'
          import hashlib,pathlib
          root=pathlib.Path('work/Source');h=hashlib.sha256()
          for p in sorted(x for x in root.rglob('*') if x.is_file() and 'obj' not in x.parts and 'bin' not in x.parts):
              rel=p.relative_to(root).as_posix().encode();h.update(rel);h.update(b'\0');h.update(p.read_bytes());h.update(b'\0')
          d=h.hexdigest();print('v119_source_sha256='+d);assert d=='684de986bd377d660172f8632c63c51c635a46986371f5e643045830a8548568'
          '@ | Set-Content -Encoding UTF8 verify119.py
          python verify119.py

      - name: Apply exact v1.0.20 native-crosshair fix
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import base64,gzip,hashlib,pathlib
          e=pathlib.Path('GuidedArrow/v120_apply.py.gz.b64').read_text().strip()
          eh=hashlib.sha256(e.encode()).hexdigest();print('apply_encoded_sha256='+eh);assert eh=='47b9c3768630a308e8e5b25d2bbcf972adb28bb07eaffbbb0fee6bc86ac59442'
          r=gzip.decompress(base64.b64decode(e))
          rh=hashlib.sha256(r).hexdigest();print('apply_script_sha256='+rh);assert rh=='407ed5cc467271c2372500b633cbc52eda0e32b8482bd28938f54b516ac87f70'
          pathlib.Path('apply_v120.py').write_bytes(r)
          '@ | Set-Content -Encoding UTF8 decode_apply.py
          python decode_apply.py
          Push-Location work
          python '..\apply_v120.py'
          if($LASTEXITCODE-ne 0){throw 'v1.0.20 apply script failed'}
          Pop-Location

      - name: Verify exact v1.0.20 source and semantics
        shell: pwsh
        run: |
          $project=Get-Content 'work/Source/GuidedArrow.csproj' -Raw
          $behavior=Get-Content 'work/Source/GuidedArrowBehavior.cs' -Raw
          $settings=Get-Content 'work/Source/Settings.cs' -Raw
          $submodule=Get-Content 'work/SubModule.xml' -Raw
          foreach($n in @('<Version>1.0.20</Version>','<FileVersion>1.0.20.0</FileVersion>','<AssemblyVersion>1.0.20.0</AssemblyVersion>')){if(-not $project.Contains($n)){throw "Missing $n"}}
          if(-not $submodule.Contains('<Version value="v1.0.20" />')){throw 'SubModule not v1.0.20'}
          foreach($n in @('SuspendNativeCrosshairViews','ResumeNativeCrosshairViews','TaleWorlds.MountAndBlade.View.MissionViews.MissionCrosshair','TaleWorlds.MountAndBlade.GauntletUI.Mission.MissionGauntletCrosshair','view.SuspendView()','view.ResumeView()')){if(-not $behavior.Contains($n)){throw "Missing native-crosshair marker: $n"}}
          foreach($n in @('AffectorWeaponSlotOrMissileIndex','OnMissileCollisionReaction','Mission.MissileCollisionReaction.PassThrough','SuspendProjectileCameraForCollisionReaction','ResumeProjectileCameraAfterPassThrough','hideFirstPersonCameraOwner')){if(-not $behavior.Contains($n)){throw "Missing preserved v1.0.18/v1.0.19 marker: $n"}}
          foreach($n in @('public bool ShowCrosshair { get; set; } = false;','public int SplitArrowFormationMode { get; set; } = 1;','public int CinematicTriggerMode { get; set; } = 1;','public float MouseSensitivity { get; set; } = 0.49829796f;','public float ProximityNearTimeSpeed { get; set; } = 0.202393547f;')){if(-not $settings.Contains($n)){throw "Missing release default marker: $n"}}
          @'
          import hashlib,pathlib
          root=pathlib.Path('work/Source');h=hashlib.sha256()
          for p in sorted(x for x in root.rglob('*') if x.is_file() and 'obj' not in x.parts and 'bin' not in x.parts):
              rel=p.relative_to(root).as_posix().encode();h.update(rel);h.update(b'\0');h.update(p.read_bytes());h.update(b'\0')
          d=h.hexdigest();print('v120_source_sha256='+d);pathlib.Path('source_hash.txt').write_text(d+'\n');assert d=='7dd069b07355459f79c28d6d7e3f9d3177c7f44296b7c7595553720bdba6704d'
          '@ | Set-Content -Encoding UTF8 verify120.py
          python verify120.py

      - name: Restore
        shell: pwsh
        run: dotnet restore 'work/Source/GuidedArrow.csproj'

      - name: Build
        shell: pwsh
        run: |
          dotnet build 'work/Source/GuidedArrow.csproj' -c Release --no-restore 2>&1 | Tee-Object -FilePath compiler.log
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}

      - name: Collect exact outputs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force compiled | Out-Null
          Copy-Item 'work/Source/bin/Release/net472/GuidedArrow.dll' compiled/GuidedArrow.dll
          Copy-Item 'work/Source/bin/Release/net472/GuidedArrow.pdb' compiled/GuidedArrow.pdb
          Copy-Item 'work/Source' compiled/Source -Recurse
          Copy-Item 'work/SubModule.xml' compiled/SubModule.xml
          Copy-Item compiler.log compiled/compiler.log
          Copy-Item source_hash.txt compiled/source_hash.txt

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: GuidedArrow-v1.0.20-compiled
          path: compiled
          if-no-files-found: error

      - name: Publish exact compiled transport to branch
        if: ${{ github.event_name == 'push' && success() }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Compress-Archive -Path 'compiled/*' -DestinationPath 'GuidedArrow-v1.0.20-compiled.zip' -Force
          @'
          import base64,hashlib,json,pathlib,shutil
          z=pathlib.Path('GuidedArrow-v1.0.20-compiled.zip').read_bytes()
          enc=base64.b64encode(z).decode('ascii')
          out=pathlib.Path('GuidedArrow/v120_output')
          if out.exists(): shutil.rmtree(out)
          out.mkdir(parents=True)
          chunk=90000
          parts=[]
          for i,start in enumerate(range(0,len(enc),chunk),1):
              name=f'part{i:02d}.txt'
              data=enc[start:start+chunk]
              (out/name).write_text(data,encoding='ascii')
              parts.append(name)
          manifest={
              'artifact':'GuidedArrow-v1.0.20-compiled.zip',
              'zip_sha256':hashlib.sha256(z).hexdigest(),
              'base64_sha256':hashlib.sha256(enc.encode('ascii')).hexdigest(),
              'zip_size':len(z),
              'base64_size':len(enc),
              'parts':parts
          }
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(manifest,indent=2))
          '@ | Set-Content -Encoding UTF8 publish_transport.py
          python publish_transport.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GuidedArrow/v120_output
          git commit -m 'Publish Guided Arrow v1.0.20 compiled transport'
          git push origin HEAD:tmp/guided-arrow-v120-native-crosshair-fix
