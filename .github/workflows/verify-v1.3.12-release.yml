name: Verify published Extreme Ragdoll v1.3.12 assets

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/verify-v1.3.12-release.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-2022
    env:
      TAG_NAME: v1.3.12
      RELEASE_NAME: Extreme Ragdoll v1.3.12
      TARGET_COMMIT: aa888aa3f789877e1f28e4b42342e13bb71bc1e3
      ASSET_NAME: ExtremeRagdoll-v1.3.12-Bannerlord-1.3.15-to-1.4.7.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Download and verify published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $metadataJson = gh release view $env:TAG_NAME `
            --repo $env:GITHUB_REPOSITORY `
            --json url,tagName,name,isDraft,isPrerelease,targetCommitish,assets
          if ($LASTEXITCODE -ne 0) { throw "Release $($env:TAG_NAME) could not be read." }
          $metadata = $metadataJson | ConvertFrom-Json

          if ($metadata.tagName -ne $env:TAG_NAME) { throw "Unexpected release tag: $($metadata.tagName)" }
          if ($metadata.name -ne $env:RELEASE_NAME) { throw "Unexpected release name: $($metadata.name)" }
          if ($metadata.isDraft) { throw 'Release is still a draft.' }
          if ($metadata.isPrerelease) { throw 'Release is marked as a prerelease.' }
          if ($metadata.targetCommitish -ne $env:TARGET_COMMIT) {
            throw "Release targets $($metadata.targetCommitish), expected $($env:TARGET_COMMIT)."
          }

          $checksumName = "$($env:ASSET_NAME).sha256"
          $assetNames = @($metadata.assets | ForEach-Object { $_.name })
          foreach ($required in @($env:ASSET_NAME, $checksumName)) {
            if ($assetNames -notcontains $required) { throw "Release asset is missing: $required" }
          }

          $downloadRoot = Join-Path $env:RUNNER_TEMP 'PublishedRelease'
          New-Item -ItemType Directory -Path $downloadRoot -Force | Out-Null
          gh release download $env:TAG_NAME --repo $env:GITHUB_REPOSITORY --pattern $env:ASSET_NAME --dir $downloadRoot
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download the installable release ZIP.' }
          gh release download $env:TAG_NAME --repo $env:GITHUB_REPOSITORY --pattern $checksumName --dir $downloadRoot
          if ($LASTEXITCODE -ne 0) { throw 'Failed to download the release checksum.' }

          $downloadedAsset = Join-Path $downloadRoot $env:ASSET_NAME
          $downloadedChecksum = Join-Path $downloadRoot $checksumName
          $checksumLine = (Get-Content $downloadedChecksum -Raw).Trim()
          if ($checksumLine -notmatch '^([0-9a-fA-F]{64})  (.+)$') { throw 'Release checksum file has an invalid format.' }
          if ($Matches[2] -ne $env:ASSET_NAME) { throw "Checksum names the wrong asset: $($Matches[2])" }
          $assetHash = (Get-FileHash $downloadedAsset -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($assetHash -ne $Matches[1].ToLowerInvariant()) {
            throw "Published ZIP checksum mismatch. actual=$assetHash expected=$($Matches[1])"
          }

          $extractRoot = Join-Path $env:RUNNER_TEMP 'PublishedReleaseExtracted'
          Expand-Archive -LiteralPath $downloadedAsset -DestinationPath $extractRoot -Force
          $moduleRoot = Join-Path $extractRoot 'ExtremeRagdoll'
          $mainPath = Join-Path $moduleRoot 'bin/Win64_Shipping_Client/ExtremeRagdoll.dll'
          $helperPath = Join-Path $moduleRoot 'bin/Win64_Shipping_Client/ExtremeRagdoll.ClothSync.dll'
          foreach ($requiredPath in @(
            (Join-Path $moduleRoot 'SubModule.xml'),
            (Join-Path $moduleRoot 'ModuleData'),
            $mainPath,
            $helperPath
          )) {
            if (-not (Test-Path -LiteralPath $requiredPath)) { throw "Published module is missing: $requiredPath" }
          }
          if (Test-Path -LiteralPath (Join-Path $moduleRoot 'Source')) {
            throw 'Installable release unexpectedly contains the source tree.'
          }

          [xml]$releasedModule = Get-Content (Join-Path $moduleRoot 'SubModule.xml') -Raw
          $releasedVersion = $releasedModule.SelectSingleNode('/Module/Version').GetAttribute('value')
          if ($releasedVersion -ne $env:TAG_NAME) {
            throw "Published SubModule.xml reports $releasedVersion, expected $($env:TAG_NAME)."
          }

          $mainHash = (Get-FileHash $mainPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $helperHash = (Get-FileHash $helperPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifestLines = @(Get-Content '.\RUNTIME_SHA256.txt' | Where-Object { $_.Trim().Length -gt 0 })
          $expectedMain = "$mainHash  bin/Win64_Shipping_Client/ExtremeRagdoll.dll"
          $expectedHelper = "$helperHash  bin/Win64_Shipping_Client/ExtremeRagdoll.ClothSync.dll"
          if ($manifestLines -notcontains $expectedMain) { throw 'Published main DLL differs from RUNTIME_SHA256.txt.' }
          if ($manifestLines -notcontains $expectedHelper) { throw 'Published helper DLL differs from RUNTIME_SHA256.txt.' }

          New-Item -ItemType Directory -Force '.\.release-status' | Out-Null
          $status = @(
            "tag=$($env:TAG_NAME)",
            "release_name=$($env:RELEASE_NAME)",
            "target_commit=$($env:TARGET_COMMIT)",
            "asset=$($env:ASSET_NAME)",
            "asset_sha256=$assetHash",
            "main_dll_sha256=$mainHash",
            "helper_dll_sha256=$helperHash",
            "module_version=$releasedVersion",
            'draft=false',
            'prerelease=false',
            'verification=passed'
          ) -join "`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD '.release-status/v1.3.12.txt'),
            $status + "`n",
            [System.Text.Encoding]::ASCII)

      - name: Record verified release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .release-status/v1.3.12.txt
          git rm -- .github/workflows/verify-v1.3.12-release.yml
          git commit -m 'Record verified Extreme Ragdoll v1.3.12 release'
          git push origin HEAD:master
