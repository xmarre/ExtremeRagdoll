name: Export Guided Arrow v1.1.5 Compiler Log

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download complete failed compiler job log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ga115-compiler-log"
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/xmarre/ExtremeRagdoll/actions/jobs/89642469775/logs" \
            -o "$RUNNER_TEMP/ga115-compiler-log/COMPLETE_JOB_LOG.txt"

      - name: Upload complete compiler log
        uses: actions/upload-artifact@v4
        with:
          name: GuidedArrow-v1.1.5-complete-compiler-log
          path: ${{ runner.temp }}/ga115-compiler-log
          if-no-files-found: error
          retention-days: 7
