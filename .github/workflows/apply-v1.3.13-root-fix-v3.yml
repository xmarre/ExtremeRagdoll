name: Commit verified Extreme Ragdoll v1.3.13

on:
  pull_request:
    branches:
      - master
    paths:
      - Source/Build/run_v1313_root_fix_v2.py
      - .github/workflows/apply-v1.3.13-root-fix-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1.3.13-root-direction-localization
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 3.1.426
      - name: Apply root fix
        shell: pwsh
        run: python .\Source\Build\run_v1313_root_fix_v2.py
      - name: Build and validate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'ExtremeRagdollV1313'
          .\Source\Build\build.ps1 -OutDir $out
          New-Item -ItemType Directory -Force '.\bin\Win64_Shipping_Client' | Out-Null
          Copy-Item "$out\bin\ExtremeRagdoll.dll" '.\bin\Win64_Shipping_Client\ExtremeRagdoll.dll' -Force
          Copy-Item "$out\bin\ExtremeRagdoll.ClothSync.dll" '.\bin\Win64_Shipping_Client\ExtremeRagdoll.ClothSync.dll' -Force
          $main = (Get-FileHash '.\bin\Win64_Shipping_Client\ExtremeRagdoll.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          $helper = (Get-FileHash '.\bin\Win64_Shipping_Client\ExtremeRagdoll.ClothSync.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText('.\RUNTIME_SHA256.txt', "$main  bin/Win64_Shipping_Client/ExtremeRagdoll.dll`n$helper  bin/Win64_Shipping_Client/ExtremeRagdoll.ClothSync.dll`n", [System.Text.Encoding]::ASCII)
      - name: Validate localization and scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$module = Get-Content '.\SubModule.xml' -Raw
          if ($module.Module.Version.value -ne 'v1.3.13') { throw 'Unexpected module version.' }
          [xml]$language = Get-Content '.\ModuleData\Languages\CNs\language_data.xml' -Raw
          if ($language.LanguageData.LanguageFile.xml_path -ne 'CNs/std_module_strings_xml.xml') { throw 'Invalid Chinese manifest.' }
          [xml]$baseStrings = Get-Content '.\ModuleData\Languages\std_module_strings_xml.xml' -Raw
          [xml]$cnStrings = Get-Content '.\ModuleData\Languages\CNs\std_module_strings_xml.xml' -Raw
          $baseIds = @($baseStrings.base.strings.string | ForEach-Object { $_.id } | Sort-Object -Unique)
          $cnIds = @($cnStrings.base.strings.string | ForEach-Object { $_.id } | Sort-Object -Unique)
          if (($baseIds -join "`n") -ne ($cnIds -join "`n")) { throw 'Chinese keys differ from base keys.' }
          git diff --check
          $allowed = @(
            'CHANGELOG.md','README.md','RUNTIME_SHA256.txt','SubModule.xml','Source/SafeSubModule.cs',
            'Source/Build/ValidateAssemblies.cs','Source/Build/build.ps1','Source/Build/build.sh',
            'Source/Build/ReferenceStubs/TaleWorlds.Localization.Stub.cs','ModuleData/Languages/std_module_strings_xml.xml',
            'ModuleData/Languages/CNs/std_module_strings_xml.xml','ModuleData/Languages/CNs/language_data.xml',
            'bin/Win64_Shipping_Client/ExtremeRagdoll.dll','bin/Win64_Shipping_Client/ExtremeRagdoll.ClothSync.dll'
          )
          $unexpected = @(git diff --name-only | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) { throw "Unexpected generated changes: $($unexpected -join ', ')" }
      - name: Commit verified source and runtime
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- CHANGELOG.md README.md RUNTIME_SHA256.txt SubModule.xml Source/SafeSubModule.cs Source/Build/ValidateAssemblies.cs Source/Build/build.ps1 Source/Build/build.sh Source/Build/ReferenceStubs/TaleWorlds.Localization.Stub.cs ModuleData bin/Win64_Shipping_Client
          git commit -m 'Fix death direction at source and register Chinese localization'
          git push origin HEAD:agent/v1.3.13-root-direction-localization
