name: Diagnose v1.3.15 patch

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'agent/fix-localization-corpse-collision-v1.3.15'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Execute patch with captured diagnostics
        continue-on-error: true
        shell: pwsh
        run: |
          $diagnosticPath = Join-Path $env:GITHUB_WORKSPACE 'PATCH_DIAGNOSTIC.txt'
          try {
            'stage=read-carrier' | Set-Content $diagnosticPath -Encoding UTF8
            $carrier = Get-Content '.github/workflows/apply-v1.3.15-fixes.yml' -Raw
            $startMarker = "@'"
            $endMarker = "'@ | Set-Content"
            $start = $carrier.IndexOf($startMarker)
            $end = $carrier.IndexOf($endMarker, $start + $startMarker.Length)
            "start=$start end=$end" | Add-Content $diagnosticPath
            if ($start -lt 0 -or $end -lt 0) { throw 'Carrier markers were not found.' }
            $script = $carrier.Substring($start + $startMarker.Length, $end - $start - $startMarker.Length)
            $script = [regex]::Replace($script, '(?m)^          ', '')
            $scriptPath = Join-Path $env:RUNNER_TEMP 'apply_v1_3_15.py'
            [System.IO.File]::WriteAllText($scriptPath, $script, [System.Text.UTF8Encoding]::new($false))
            'stage=execute-python' | Add-Content $diagnosticPath
            $output = & python $scriptPath 2>&1
            $exitCode = $LASTEXITCODE
            $output | Add-Content $diagnosticPath
            "exitCode=$exitCode" | Add-Content $diagnosticPath
            if ($exitCode -ne 0) { throw "Python patch failed with exit code $exitCode." }
            'stage=success' | Add-Content $diagnosticPath
          }
          catch {
            'stage=failed' | Add-Content $diagnosticPath
            ($_ | Out-String) | Add-Content $diagnosticPath
            throw
          }

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v1.3.15-patch-diagnostic
          path: PATCH_DIAGNOSTIC.txt
          if-no-files-found: error
