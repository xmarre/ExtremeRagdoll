name: Inspect Guided Arrow v1.1.12 Bannerlord API

on:
  pull_request:
    branches: [ codex/ga1111-release-base ]

permissions:
  contents: read

jobs:
  inspect-api:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Build API inspector
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'ga1112-api'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          Copy-Item 'tools/ga1112/InspectBannerlordApi.cs' (Join-Path $root 'Program.cs')
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>disable</ImplicitUsings>
              <Nullable>disable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Mono.Cecil" Version="0.11.6" />
              <PackageReference Include="Bannerlord.ReferenceAssemblies.Core" Version="1.3.15.110062" />
              <PackageReference Include="Bannerlord.ReferenceAssemblies.Native" Version="1.3.15.110062" />
            </ItemGroup>
          </Project>
          '@ | Set-Content -LiteralPath (Join-Path $root 'ApiInspect.csproj') -Encoding utf8
          dotnet restore (Join-Path $root 'ApiInspect.csproj') --nologo
          dotnet run --project (Join-Path $root 'ApiInspect.csproj') -c Release --no-restore 2>&1 | Tee-Object -FilePath (Join-Path $root 'BANNERLORD_API.txt')

      - name: Upload API report
        uses: actions/upload-artifact@v4
        with:
          name: GuidedArrow-v1.1.12-api-report
          path: ${{ runner.temp }}\ga1112-api\BANNERLORD_API.txt
          if-no-files-found: error
          retention-days: 7
