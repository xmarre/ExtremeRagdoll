name: Diagnose v1.3.10 build

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 3.1.426
      - name: Reconstruct and build v1.3.10
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://raw.githubusercontent.com/xmarre/ExtremeRagdoll/refs/heads/agent/clean-v1.3.10-source/bootstrap'
          $names = @('chunk-000.txt','chunk-001.txt','chunk-01.txt','chunk-02.txt','chunk-03.txt','chunk-04.txt','chunk-05.txt','chunk-06.txt','chunk-07.txt','chunk-08.txt','chunk-09x0.txt','chunk-09x1.txt','chunk-09x2.txt','chunk-09z0.txt','chunk-09z1.txt','chunk-09z2.txt','chunk-09z3.txt','chunk-09z4.txt','chunk-09z5.txt','chunk-09z6.txt','chunk-09z7.txt','chunk-10.txt')
          $encoded = ($names | ForEach-Object { (Invoke-WebRequest -UseBasicParsing "$base/$_").Content }) -join ''
          $zip = Join-Path $env:RUNNER_TEMP 'clean.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($encoded))
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '71992d2b6cbb87767b948d0d5840395c03190cfdf3f1baef365b3f6c658935f9') { throw "ZIP hash mismatch: $actual" }
          $clean = Join-Path $env:RUNNER_TEMP 'clean'
          Expand-Archive $zip $clean -Force
          Set-Location $clean
          .\Source\Build\build.ps1
