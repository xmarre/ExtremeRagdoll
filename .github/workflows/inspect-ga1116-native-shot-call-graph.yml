name: Inspect Guided Arrow Native Shot Call Graph

on:
  pull_request:
    branches: [ codex/ga1115-split-spawn-recovery ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Inspect Bannerlord native missile routing
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'ga1116-native-calls'
          New-Item -ItemType Directory -Path $root -Force|Out-Null
          Copy-Item './tools/ga1116/InspectNativeShotCalls.cs' (Join-Path $root 'Program.cs')
          @'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>disable</ImplicitUsings>
              <Nullable>disable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Mono.Cecil" Version="0.11.6" />
              <PackageReference Include="Bannerlord.ReferenceAssemblies.Core" Version="1.3.15.110062" />
            </ItemGroup>
          </Project>
          '@ | Set-Content -LiteralPath (Join-Path $root 'Inspector.csproj') -Encoding utf8
          dotnet restore (Join-Path $root 'Inspector.csproj') --nologo
          dotnet run --project (Join-Path $root 'Inspector.csproj') -c Release --no-restore -- 1.3.15.110062 2>&1 | Tee-Object -FilePath (Join-Path $root 'NATIVE_SHOT_CALL_GRAPH.txt')
      - name: Upload call graph
        uses: actions/upload-artifact@v4
        with:
          name: GuidedArrow-v1.1.16-native-shot-call-graph
          path: ${{ runner.temp }}\ga1116-native-calls\NATIVE_SHOT_CALL_GRAPH.txt
          if-no-files-found: error
          retention-days: 7
