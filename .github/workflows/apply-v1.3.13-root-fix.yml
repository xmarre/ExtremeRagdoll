name: Apply and verify Extreme Ragdoll v1.3.13

on:
  pull_request:
    branches:
      - master
    paths:
      - Source/Build/apply_v1313_root_fix.py
      - .github/workflows/apply-v1.3.13-root-fix.yml
  push:
    branches:
      - agent/v1.3.13-root-direction-localization
    paths:
      - Source/Build/apply_v1313_root_fix.py
      - .github/workflows/apply-v1.3.13-root-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2022

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/v1.3.13-root-direction-localization
          fetch-depth: 0

      - name: Install .NET Core SDK 3.1
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 3.1.426

      - name: Apply exact root patch
        shell: pwsh
        run: python .\Source\Build\apply_v1313_root_fix.py

      - name: Build and validate assemblies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'ExtremeRagdollV1313'
          .\Source\Build\build.ps1 -OutDir $out
          New-Item -ItemType Directory -Force '.\bin\Win64_Shipping_Client' | Out-Null
          Copy-Item "$out\bin\ExtremeRagdoll.dll" '.\bin\Win64_Shipping_Client\ExtremeRagdoll.dll' -Force
          Copy-Item "$out\bin\ExtremeRagdoll.ClothSync.dll" '.\bin\Win64_Shipping_Client\ExtremeRagdoll.ClothSync.dll' -Force

          $main = (Get-FileHash '.\bin\Win64_Shipping_Client\ExtremeRagdoll.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          $helper = (Get-FileHash '.\bin\Win64_Shipping_Client\ExtremeRagdoll.ClothSync.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @(
            "$main  bin/Win64_Shipping_Client/ExtremeRagdoll.dll"
            "$helper  bin/Win64_Shipping_Client/ExtremeRagdoll.ClothSync.dll"
          ) -join "`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'RUNTIME_SHA256.txt'),
            $manifest + "`n",
            [System.Text.Encoding]::ASCII)

      - name: Validate module and localization package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$module = Get-Content '.\SubModule.xml' -Raw
          if ($module.Module.Version.value -ne 'v1.3.13') { throw 'Unexpected module version.' }

          [xml]$language = Get-Content '.\ModuleData\Languages\CNs\language_data.xml' -Raw
          $languageFile = @($language.LanguageData.LanguageFile)
          if ($languageFile.Count -ne 1 -or $languageFile[0].xml_path -ne 'CNs/std_module_strings_xml.xml') {
            throw 'Simplified Chinese language_data.xml does not register the expected file.'
          }

          [xml]$baseStrings = Get-Content '.\ModuleData\Languages\std_module_strings_xml.xml' -Raw
          [xml]$cnStrings = Get-Content '.\ModuleData\Languages\CNs\std_module_strings_xml.xml' -Raw
          $baseIds = @($baseStrings.base.strings.string | ForEach-Object { $_.id } | Sort-Object -Unique)
          $cnIds = @($cnStrings.base.strings.string | ForEach-Object { $_.id } | Sort-Object -Unique)
          if (($baseIds -join "`n") -ne ($cnIds -join "`n")) { throw 'Chinese localization keys differ from the base keys.' }

          $stage = Join-Path $env:RUNNER_TEMP 'ExtremeRagdoll'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item '.\SubModule.xml' $stage
          Copy-Item '.\ModuleData' $stage -Recurse
          Copy-Item '.\bin' $stage -Recurse
          $zip = Join-Path $env:RUNNER_TEMP 'ExtremeRagdoll-v1.3.13.zip'
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          $extract = Join-Path $env:RUNNER_TEMP 'ExtremeRagdollExtracted'
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          if (-not (Test-Path (Join-Path $extract 'ExtremeRagdoll/ModuleData/Languages/CNs/language_data.xml'))) {
            throw 'Packaged module is missing the Chinese language manifest.'
          }

      - name: Review generated scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          git diff --stat
          $allowed = @(
            '.github/workflows/build.yml',
            'CHANGELOG.md',
            'README.md',
            'RUNTIME_SHA256.txt',
            'SubModule.xml',
            'Source/SafeSubModule.cs',
            'Source/Build/ValidateAssemblies.cs',
            'Source/Build/build.ps1',
            'Source/Build/build.sh',
            'Source/Build/ReferenceStubs/TaleWorlds.Localization.Stub.cs',
            'ModuleData/Languages/std_module_strings_xml.xml',
            'ModuleData/Languages/CNs/std_module_strings_xml.xml',
            'ModuleData/Languages/CNs/language_data.xml',
            'bin/Win64_Shipping_Client/ExtremeRagdoll.dll',
            'bin/Win64_Shipping_Client/ExtremeRagdoll.ClothSync.dll'
          )
          $changed = @(git diff --name-only)
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) { throw "Unexpected generated changes: $($unexpected -join ', ')" }

      - name: Commit verified v1.3.13 source and runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .github/workflows/build.yml CHANGELOG.md README.md RUNTIME_SHA256.txt SubModule.xml Source ModuleData bin/Win64_Shipping_Client
          git commit -m 'Fix death direction at source and register Chinese localization'
          git push origin HEAD:agent/v1.3.13-root-direction-localization
