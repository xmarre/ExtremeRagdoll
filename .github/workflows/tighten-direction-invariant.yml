name: Tighten and verify direction invariant

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/tighten-direction-invariant.yml

permissions:
  contents: write

jobs:
  tighten:
    runs-on: windows-2022

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-deathblow-direction
          fetch-depth: 0

      - name: Install .NET Core SDK 3.1
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 3.1.426

      - name: Reject every opposing engine vector
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          path = Path('Source/SafeSubModule.cs')
          raw = path.read_bytes()
          old = b'< -0.05f'
          new = b'< 0f'
          count = raw.count(old)
          if count != 2:
              raise RuntimeError(f'expected two opposing-dot thresholds, got {count}')
          path.write_bytes(raw.replace(old, new))
          '@ | Set-Content -Path "$env:RUNNER_TEMP\tighten.py" -Encoding utf8
          python "$env:RUNNER_TEMP\tighten.py"

      - name: Build and validate assemblies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'ExtremeRagdollDirectionTighten'
          .\Source\Build\build.ps1 -OutDir $out
          Copy-Item "$out\bin\ExtremeRagdoll.dll" '.\bin\Win64_Shipping_Client\ExtremeRagdoll.dll' -Force
          Copy-Item "$out\bin\ExtremeRagdoll.ClothSync.dll" '.\bin\Win64_Shipping_Client\ExtremeRagdoll.ClothSync.dll' -Force
          $main = (Get-FileHash '.\bin\Win64_Shipping_Client\ExtremeRagdoll.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          $helper = (Get-FileHash '.\bin\Win64_Shipping_Client\ExtremeRagdoll.ClothSync.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @(
            "$main  bin/Win64_Shipping_Client/ExtremeRagdoll.dll"
            "$helper  bin/Win64_Shipping_Client/ExtremeRagdoll.ClothSync.dll"
          ) -join "`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'RUNTIME_SHA256.txt'),
            $manifest + "`n",
            [System.Text.Encoding]::ASCII)
          git diff --check

      - name: Commit verified tightening
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Source/SafeSubModule.cs bin/Win64_Shipping_Client RUNTIME_SHA256.txt
          git rm -- .github/workflows/tighten-direction-invariant.yml
          git commit -m 'Reject all opposing engine impulses'
          git push origin HEAD:agent/fix-deathblow-direction
