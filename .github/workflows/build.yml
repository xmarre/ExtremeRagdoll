name: Build and verify runtime

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Apply final v1.3.15 source refinement
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/fix-localization-corpse-collision-v1.3.15'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          source_path = Path('Source/SafeSubModule.cs')
          text = source_path.read_text(encoding='utf-8')

          start = text.index('    internal static class LocalizationBootstrap')
          end = text.index('    internal static class CompatibilityState', start)
          bootstrap = r'''    internal static class LocalizationBootstrap
    {
        private static bool _registered;

        internal static void EnsureRegistered()
        {
            if (_registered)
                return;

            try
            {
                string assemblyDirectory = Path.GetDirectoryName(Assembly.GetExecutingAssembly().Location);
                DirectoryInfo platformDirectory = string.IsNullOrEmpty(assemblyDirectory)
                    ? null
                    : new DirectoryInfo(assemblyDirectory);
                DirectoryInfo binDirectory = platformDirectory == null ? null : platformDirectory.Parent;
                DirectoryInfo moduleDirectory = binDirectory == null ? null : binDirectory.Parent;
                if (moduleDirectory == null)
                    throw new InvalidOperationException("Could not resolve the ExtremeRagdoll module root.");

                Assembly localizationAssembly = typeof(TextObject).Assembly;
                Type localizedTextManager = localizationAssembly.GetType(
                    "TaleWorlds.Localization.LocalizedTextManager", false);
                MethodInfo addLocalizationXml = localizedTextManager == null
                    ? null
                    : localizedTextManager.GetMethod(
                        "AddLocalizationXml",
                        BindingFlags.Public | BindingFlags.Static,
                        null,
                        new[] { typeof(string) },
                        null);
                if (addLocalizationXml == null)
                {
                    throw new MissingMethodException(
                        "TaleWorlds.Localization.LocalizedTextManager",
                        "AddLocalizationXml");
                }

                // Bannerlord's initial localization discovery runs before submodule loading.
                // Merge this module's manifest into the live LanguageData registry before MCM
                // resolves its setting labels. LanguageData de-duplicates an existing path.
                addLocalizationXml.Invoke(null, new object[] { moduleDirectory.FullName });

                Type mbTextManager = localizationAssembly.GetType(
                    "TaleWorlds.Localization.MBTextManager", false);
                PropertyInfo activeLanguageProperty = mbTextManager == null
                    ? null
                    : mbTextManager.GetProperty(
                        "ActiveTextLanguage", BindingFlags.Public | BindingFlags.Static);
                MethodInfo changeLanguage = mbTextManager == null
                    ? null
                    : mbTextManager.GetMethod(
                        "ChangeLanguage",
                        BindingFlags.Public | BindingFlags.Static,
                        null,
                        new[] { typeof(string) },
                        null);
                string activeLanguage = activeLanguageProperty == null
                    ? null
                    : activeLanguageProperty.GetValue(null, null) as string;

                // The active dictionary was populated before OnSubModuleLoad. Reload the same
                // non-English language once after registration. Later language changes retain
                // and use the native LanguageData path without any per-tick work.
                if (!string.IsNullOrEmpty(activeLanguage) &&
                    !string.Equals(activeLanguage, "English", StringComparison.OrdinalIgnoreCase))
                {
                    if (changeLanguage == null)
                    {
                        throw new MissingMethodException(
                            "TaleWorlds.Localization.MBTextManager", "ChangeLanguage");
                    }

                    object changed = changeLanguage.Invoke(null, new object[] { activeLanguage });
                    if (changed is bool && !(bool)changed)
                    {
                        throw new InvalidOperationException(
                            "Bannerlord rejected localization reload for " + activeLanguage + ".");
                    }
                }

                if (IsSimplifiedChinese(activeLanguage))
                {
                    string probe = new TextObject("{=ER_DisplayName}Extreme Ragdoll").ToString();
                    if (string.Equals(probe, "Extreme Ragdoll", StringComparison.Ordinal))
                    {
                        throw new InvalidOperationException(
                            "Simplified Chinese manifest was registered, but ER_DisplayName still resolved to its English fallback.");
                    }
                }

                _registered = true;
                SafeLog.Info(
                    "Localization manifest registered through Bannerlord LanguageData; activeLanguage=" +
                    (activeLanguage ?? "<unavailable>") + ".");
            }
            catch (TargetInvocationException ex)
            {
                SafeLog.Error(
                    "ExtremeRagdoll localization registration failed",
                    ex.InnerException ?? ex);
            }
            catch (Exception ex)
            {
                SafeLog.Error("ExtremeRagdoll localization registration failed", ex);
            }
        }

        private static bool IsSimplifiedChinese(string language)
        {
            if (string.IsNullOrEmpty(language))
                return false;

            return language.IndexOf("简体中文", StringComparison.OrdinalIgnoreCase) >= 0 ||
                   language.IndexOf("zh-HANS", StringComparison.OrdinalIgnoreCase) >= 0 ||
                   language.IndexOf("zh-CN", StringComparison.OrdinalIgnoreCase) >= 0 ||
                   language.IndexOf("ChineseSimplified", StringComparison.OrdinalIgnoreCase) >= 0;
        }
    }

'''
          text = text[:start] + bootstrap + text[end:]

          old_constants = '''        private const float CorpseFinalizationTimeout = 30f;
        private const float CorpseActiveStateFallbackTimeout = 2f;
        private const float CorpseFinalizationPollInterval = 0.10f;'''
          new_constants = '''        private const float CorpseFinalizationTimeout = 30f;
        private const float CorpseFinalizationFailureGrace = 5f;
        private const float CorpseActiveStateFallbackTimeout = 2f;
        private const float CorpseFinalizationPollInterval = 0.10f;'''
          if 'private const float CorpseFinalizationFailureGrace = 5f;' not in text:
              if text.count(old_constants) != 1:
                  raise RuntimeError('Expected corpse finalization constant block once.')
              text = text.replace(old_constants, new_constants)

          old_catch = '''                catch
                {
                    // Keep only this corpse retryable and throttle failures. One broken corpse must not starve later
                    // entries or crash the mission. The same 30-second ownership bound prevents a permanently failing
                    // wrapper/reflection path from remaining in the mission queue indefinitely.
                    PendingDeath pending = i >= 0 && i < _pending.Count ? _pending[i] : null;
                    if (pending != null && pending.PulseCount < 0)
                    {
                        if (now - pending.RagdollSeenAt > CorpseFinalizationTimeout)
                            _pending.RemoveAt(i);
                        else
                            pending.CurrentPulseBaseMagnitude = now + CorpseFinalizationPollInterval;
                    }
                }'''
          new_catch = '''                catch
                {
                    // Keep only this corpse retryable and throttle failures. A transient
                    // EndRagdollAsCorpse failure after the Dismemberment Plus safety window gets
                    // a short bounded grace period; one broken native wrapper still cannot remain
                    // in the mission queue indefinitely or starve later corpses.
                    PendingDeath pending = i >= 0 && i < _pending.Count ? _pending[i] : null;
                    if (pending != null && pending.PulseCount < 0)
                    {
                        float failureDeadline =
                            CorpseFinalizationTimeout + CorpseFinalizationFailureGrace;
                        if (now - pending.RagdollSeenAt > failureDeadline)
                            _pending.RemoveAt(i);
                        else
                            pending.CurrentPulseBaseMagnitude = now + CorpseFinalizationPollInterval;
                    }
                }'''
          if old_catch in text:
              text = text.replace(old_catch, new_catch)
          elif new_catch not in text:
              raise RuntimeError('Recognized corpse finalization catch block was not found.')

          source_path.write_text(text, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          anchor = '- Paired the delayed `EndRagdollAsCorpse` call after that safety window so corpses do not remain permanent physical obstacles.\n'
          retry_line = '- Retries transient corpse-finalization failures for five seconds after the mesh-safety timeout before abandoning a broken native wrapper.\n'
          if retry_line not in changelog:
              if changelog.count(anchor) != 1:
                  raise RuntimeError('Expected v1.3.15 changelog anchor once.')
              changelog = changelog.replace(anchor, anchor + retry_line)
              changelog_path.write_text(changelog, encoding='utf-8')

          final = source_path.read_text(encoding='utf-8')
          for marker in (
              'private const float CorpseFinalizationFailureGrace = 5f;',
              'CorpseFinalizationTimeout + CorpseFinalizationFailureGrace',
              'internal static class LocalizationBootstrap'):
              if marker not in final:
                  raise RuntimeError('Missing refinement invariant: ' + marker)
          '@ | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\refine_v1_3_15.py"
          python "$env:RUNNER_TEMP\refine_v1_3_15.py"
          if ($LASTEXITCODE -ne 0) { throw "Refinement script failed with exit code $LASTEXITCODE." }

      - name: Install .NET Core SDK 3.1
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 3.1.426

      - name: Build current source
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "ExtremeRagdollBuild"
          .\Source\Build\build.ps1 -OutDir $out
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed with exit code $LASTEXITCODE." }
          New-Item -ItemType Directory -Force ".\bin\Win64_Shipping_Client" | Out-Null
          Copy-Item "$out\bin\ExtremeRagdoll.dll" ".\bin\Win64_Shipping_Client\ExtremeRagdoll.dll" -Force
          Copy-Item "$out\bin\ExtremeRagdoll.ClothSync.dll" ".\bin\Win64_Shipping_Client\ExtremeRagdoll.ClothSync.dll" -Force

          $main = (Get-FileHash ".\bin\Win64_Shipping_Client\ExtremeRagdoll.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          $helper = (Get-FileHash ".\bin\Win64_Shipping_Client\ExtremeRagdoll.ClothSync.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @(
            "$main  bin/Win64_Shipping_Client/ExtremeRagdoll.dll"
            "$helper  bin/Win64_Shipping_Client/ExtremeRagdoll.ClothSync.dll"
          )
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE "RUNTIME_SHA256.txt"
          [System.IO.File]::WriteAllText(
            $manifestPath,
            ($manifest -join "`n") + "`n",
            [System.Text.Encoding]::ASCII)

      - name: Update PR implementation and runtime
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: pwsh
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: |
          $paths = @(
            'Source/SafeSubModule.cs',
            'CHANGELOG.md',
            'bin/Win64_Shipping_Client',
            'RUNTIME_SHA256.txt'
          )
          if (-not (git status --porcelain -- $paths)) {
            Write-Host "Refined implementation and runtime already match."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $paths
          git commit -m "Harden corpse finalization retry and format localization bootstrap"
          git push "https://x-access-token:${env:GH_PUSH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Verify committed runtime on default branch
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          if (git status --porcelain -- bin/Win64_Shipping_Client RUNTIME_SHA256.txt) {
            git diff -- bin/Win64_Shipping_Client RUNTIME_SHA256.txt
            throw "Committed runtime binaries do not match the current source build."
          }

      - name: Validate module and localization data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          [xml]$module = Get-Content '.\SubModule.xml' -Raw
          if ($module.Module.Version.value -ne 'v1.3.15') {
            throw "Unexpected module version: $($module.Module.Version.value)"
          }

          [xml]$languageData = Get-Content '.\ModuleData\Languages\CNs\language_data.xml' -Raw
          $registeredFiles = @($languageData.LanguageData.LanguageFile | ForEach-Object { $_.xml_path })
          if ($registeredFiles.Count -ne 1 -or $registeredFiles[0] -ne 'CNs/std_module_strings_xml.xml') {
            throw "Unexpected Simplified Chinese language registration: $($registeredFiles -join ', ')"
          }

          [xml]$english = Get-Content '.\ModuleData\Languages\std_module_strings_xml.xml' -Raw
          [xml]$chinese = Get-Content '.\ModuleData\Languages\CNs\std_module_strings_xml.xml' -Raw
          foreach ($table in @($english, $chinese)) {
            $root = $table.DocumentElement
            if ($root.LocalName -ne 'base' -or $root.GetAttribute('type') -ne 'string') {
              throw 'Localization string table must use a <base type="string"> root.'
            }
            if ($root.GetNamespaceOfPrefix('xsi') -ne 'http://www.w3.org/2001/XMLSchema-instance' -or
                $root.GetNamespaceOfPrefix('xsd') -ne 'http://www.w3.org/2001/XMLSchema') {
              throw 'Localization string table is missing the standard XML schema namespace declarations.'
            }
          }

          $englishLanguage = [string]$english.base.tags.tag.language
          $chineseLanguage = [string]$chinese.base.tags.tag.language
          if ($englishLanguage -ne 'English') { throw "Unexpected base language tag: $englishLanguage" }
          if ($chineseLanguage -ne '简体中文') { throw "Unexpected Chinese language tag: $chineseLanguage" }

          $englishNodes = @($english.base.strings.string)
          $chineseNodes = @($chinese.base.strings.string)
          $englishIds = @($englishNodes | ForEach-Object { [string]$_.id })
          $chineseIds = @($chineseNodes | ForEach-Object { [string]$_.id })
          if (($englishIds | Sort-Object -Unique).Count -ne $englishIds.Count) { throw 'Duplicate English localization IDs.' }
          if (($chineseIds | Sort-Object -Unique).Count -ne $chineseIds.Count) { throw 'Duplicate Chinese localization IDs.' }
          $englishKeySet = ($englishIds | Sort-Object) -join "`n"
          $chineseKeySet = ($chineseIds | Sort-Object) -join "`n"
          if ($englishKeySet -ne $chineseKeySet) {
            throw 'English and Simplified Chinese localization ID sets differ.'
          }
          if (@($englishNodes | Where-Object { [string]::IsNullOrWhiteSpace([string]$_.text) }).Count -gt 0 -or
              @($chineseNodes | Where-Object { [string]::IsNullOrWhiteSpace([string]$_.text) }).Count -gt 0) {
            throw 'Localization contains an empty translation value.'
          }

          $sourceText = Get-Content '.\Source\SafeSubModule.cs' -Raw
          $referencedIds = @([regex]::Matches($sourceText, '\{=([A-Za-z0-9_]+)\}') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique)
          $missingIds = @($referencedIds | Where-Object { $_ -notin $englishIds })
          if ($missingIds.Count -gt 0) {
            throw "Source references missing localization IDs: $($missingIds -join ', ')"
          }

      - name: Package module artifact
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "ExtremeRagdoll"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item ".\SubModule.xml" $stage
          Copy-Item ".\ModuleData" $stage -Recurse
          Copy-Item ".\bin" $stage -Recurse
          Compress-Archive -Path $stage -DestinationPath ".\ExtremeRagdoll-v1.3.15.zip" -Force

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtremeRagdoll-v1.3.15
          path: ExtremeRagdoll-v1.3.15.zip
          if-no-files-found: error
