name: Bootstrap clean v1.3.10 repository

on:
  push:
    branches:
      - agent/clean-v1.3.10-source
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2022
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: agent/clean-v1.3.10-source
          fetch-depth: 0

      - name: Preserve bootstrap workflow
        shell: pwsh
        run: Copy-Item '.\.github\workflows\bootstrap.yml' (Join-Path $env:RUNNER_TEMP 'bootstrap.yml') -Force

      - name: Install .NET Core SDK 3.1
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 3.1.426

      - name: Reconstruct and extract clean source payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $chunkDir = Join-Path $env:GITHUB_WORKSPACE 'bootstrap/chunks'
          $chunks = Get-ChildItem -LiteralPath $chunkDir -File -Filter 'chunk-*' | Sort-Object Name
          if ($chunks.Count -ne 11) { throw "Expected 11 payload chunks, found $($chunks.Count)." }
          $encoded = [string]::Concat(($chunks | ForEach-Object { [System.IO.File]::ReadAllText($_.FullName) }))
          $zip = Join-Path $env:RUNNER_TEMP 'extreme-ragdoll-clean.zip'
          [System.IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($encoded))
          $actualHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedHash = '71992d2b6cbb87767b948d0d5840395c03190cfdf3f1baef365b3f6c658935f9'
          if ($actualHash -ne $expectedHash) { throw "Payload SHA-256 mismatch: $actualHash" }
          $stage = Join-Path $env:RUNNER_TEMP 'extreme-ragdoll-clean'
          if (Test-Path -LiteralPath $stage) { Remove-Item $stage -Recurse -Force }
          Expand-Archive -LiteralPath $zip -DestinationPath $stage -Force
          if (-not (Test-Path -LiteralPath (Join-Path $stage 'Source/SafeSubModule.cs'))) {
            throw 'Extracted payload is incomplete.'
          }

      - name: Replace repository contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm -r -f --ignore-unmatch -- .
          $stage = Join-Path $env:RUNNER_TEMP 'extreme-ragdoll-clean'
          $process = Start-Process -FilePath robocopy -ArgumentList @(
            $stage,
            $env:GITHUB_WORKSPACE,
            '/E',
            '/COPY:DAT',
            '/R:2',
            '/W:1',
            '/NFL',
            '/NDL',
            '/NJH',
            '/NJS'
          ) -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ge 8) { throw "robocopy failed with exit code $($process.ExitCode)." }
          Remove-Item '.\.github\workflows\build.yml' -Force
          New-Item -ItemType Directory -Path '.\.github\workflows' -Force | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP 'bootstrap.yml') '.\.github\workflows\bootstrap.yml' -Force

      - name: Apply source maintenance fixes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $project = '.\Source\Build\Tools\Mono.Cecil.csproj'
          $projectContent = Get-Content -LiteralPath $project -Raw
          $projectNeedle = '    <TargetFramework>netstandard2.0</TargetFramework>'
          $projectReplacement = $projectNeedle + "`r`n    <PackageId>ExtremeRagdoll.BuildDependencies</PackageId>"
          if (-not $projectContent.Contains($projectNeedle)) { throw 'Expected TargetFramework element was not found.' }
          $projectContent.Replace($projectNeedle, $projectReplacement) | Set-Content -LiteralPath $project -Encoding utf8

          $validator = '.\Source\Build\ValidateAssemblies.cs'
          $validatorContent = Get-Content -LiteralPath $validator -Raw
          $oldCondition = 'Require(strings.Any(s => s.Contains("NONMISSILE_POST_RAGDOLL_ROUTE")),'
          $newCondition = 'Require(!strings.Any(s => s.Contains("NONMISSILE_POST_RAGDOLL_ROUTE")),'
          $oldMessage = '"non-missile post-ragdoll route marker is missing");'
          $newMessage = '"obsolete non-missile-only route marker remains");'
          if (-not $validatorContent.Contains($oldCondition)) { throw 'Expected stale route-marker condition was not found.' }
          if (-not $validatorContent.Contains($oldMessage)) { throw 'Expected stale route-marker message was not found.' }
          $validatorContent = $validatorContent.Replace($oldCondition, $newCondition)
          $validatorContent = $validatorContent.Replace($oldMessage, $newMessage)
          $validatorContent | Set-Content -LiteralPath $validator -Encoding utf8

      - name: Build and validate v1.3.10
        shell: pwsh
        run: .\Source\Build\build.ps1

      - name: Stage runtime binaries and clean generated files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $env:GITHUB_WORKSPACE 'bin/Win64_Shipping_Client'
          New-Item -ItemType Directory -Path $runtime -Force | Out-Null
          Copy-Item '.\Source\Build\out\bin\ExtremeRagdoll.dll' (Join-Path $runtime 'ExtremeRagdoll.dll') -Force
          Copy-Item '.\Source\Build\out\bin\ExtremeRagdoll.ClothSync.dll' (Join-Path $runtime 'ExtremeRagdoll.ClothSync.dll') -Force
          $main = (Get-FileHash (Join-Path $runtime 'ExtremeRagdoll.dll') -Algorithm SHA256).Hash.ToLowerInvariant()
          $helper = (Get-FileHash (Join-Path $runtime 'ExtremeRagdoll.ClothSync.dll') -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$main  bin/Win64_Shipping_Client/ExtremeRagdoll.dll"
            "$helper  bin/Win64_Shipping_Client/ExtremeRagdoll.ClothSync.dll"
          ) | Set-Content -LiteralPath '.\RUNTIME_SHA256.txt' -Encoding ascii
          Remove-Item '.\Source\Build\out' -Recurse -Force
          Remove-Item '.\Source\Build\Tools\obj' -Recurse -Force

      - name: Commit verified clean tree
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'Clean repository and build v1.3.10'
          git push origin HEAD:agent/clean-v1.3.10-source
