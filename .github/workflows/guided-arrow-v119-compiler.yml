name: Temporary Guided Arrow v1.0.19 Compiler

on:
  pull_request:
    paths:
      - 'GuidedArrow/.v119-compile-trigger'
      - 'GuidedArrow/v119.patch.gz.b64'
      - '.github/workflows/guided-arrow-v119-compiler.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Reconstruct exact v1.0.18 baseline
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem 'GuidedArrow/v109_payload/part*.txt' | Sort-Object Name
          if($parts.Count -ne 5){throw "Expected 5 v109 parts"}
          $encoded=($parts|%{Get-Content $_.FullName -Raw}) -join ''
          [IO.File]::WriteAllBytes('v109.zip',[Convert]::FromBase64String($encoded))
          Expand-Archive v109.zip v119src -Force
          python -c "import base64,gzip,pathlib; names=['v110.patch','slot.patch','visibility.patch','v111.patch']; src=['GuidedArrow/v110.patch.gz.b64','GuidedArrow/v110-slot-fix.patch.gz.b64','GuidedArrow/v110-public-visibility-fix.patch.gz.b64','GuidedArrow/v111.patch.gz.b64']; [pathlib.Path(n).write_bytes(gzip.decompress(base64.b64decode(pathlib.Path(s).read_text().strip()))) for n,s in zip(names,src)]"
          Push-Location v119src
          git init | Out-Null
          git config core.whitespace cr-at-eol
          foreach($patch in @('..\v110.patch','..\slot.patch','..\visibility.patch','..\v111.patch')){git apply --check $patch;if($LASTEXITCODE-ne 0){throw "check $patch"};git apply $patch;if($LASTEXITCODE-ne 0){throw "apply $patch"}}
          Pop-Location
          @'
          import base64,gzip,hashlib,pathlib
          def make(out, paths, encsha, rawsha):
              e=''.join(pathlib.Path(p).read_text().strip() for p in paths)
              assert hashlib.sha256(e.encode()).hexdigest()==encsha
              r=gzip.decompress(base64.b64decode(e))
              assert hashlib.sha256(r).hexdigest()==rawsha
              pathlib.Path(out).write_bytes(r)
          make('v112.patch',[str(p) for p in sorted(pathlib.Path('GuidedArrow/v112_payload').glob('part*.txt'))],'09f3869fb3e7eb26e64840d72806bf73f9ec4e607472f85d7506a61c4df535ed','f94c435ca30696e71b7bf7b9df9d75c20405a294d8b6a3f9a454f270ef7c2ec3')
          make('v113.patch',[str(p) for p in sorted(pathlib.Path('GuidedArrow/v113_payload').glob('part*.txt'))],'732359dbafb7fe1c246f13e3e8e8829c955f059ce8f96eda72e57c75d9779193','ba6a37e0b3816536e4a38d667c2dbbdcff4c0aeb1bb20bf6e9da2284b020504e')
          make('v114.patch',['GuidedArrow/v114c_payload/part01.txt','GuidedArrow/v114c_payload/part02.txt','GuidedArrow/v114c_payload/part03.txt','GuidedArrow/v114d_payload/part04.txt','GuidedArrow/v114d_payload/part05.txt','GuidedArrow/v114d_payload/part06.txt','GuidedArrow/v114d_payload/part07.txt'],'e72d17d47496ae93b122aea6a84696cbf206c96423fa3022f3b69d3cc8659b3a','b6e9997f36f1f8021e3d68a752030c6658f5665569ce4abc97fe4104574abef5')
          make('v115.patch',[str(p) for p in sorted(pathlib.Path('GuidedArrow/v115_payload').glob('part*.txt'))],'5fc3606bddd34659e48e13820f7fe89e4e21bd335a05929f9d388c4e819408b5','cc23f5084c6a1b300c9e6f2a1e177d482869b159db5fbea87170bc62ae005e5f')
          make('v116.patch',['GuidedArrow/v116_payload/part01.txt','GuidedArrow/v116b_payload/part02.txt','GuidedArrow/v116b_payload/part03.txt','GuidedArrow/v116b_payload/part04.txt'],'eb6d77f25ab9d6673b53bce1eed3af2da3271157876d40690c4676d722364a7f','6703715f281323394cb2540d4082a4b870f379ab8e7a20b5340ac7d83ce6e643')
          make('v117.patch',[str(p) for p in sorted(pathlib.Path('GuidedArrow/v117_payload').glob('part*.txt'))],'0f0e893b2dd8951e70027732d178004e262b8407ffb7baa51d4835aa7cccb00e','dbe7e9b16a1835e85cc271e6bea08967cd8248310a7ca949572b721907fcb794')
          '@ | Set-Content -Encoding UTF8 reconstruct.py
          python reconstruct.py
          Push-Location v119src
          foreach($patch in @('..\v112.patch','..\v113.patch','..\v114.patch','..\v115.patch','..\v116.patch')){git apply --check $patch;if($LASTEXITCODE-ne 0){throw "check $patch"};git apply $patch;if($LASTEXITCODE-ne 0){throw "apply $patch"}}
          Pop-Location
          $sm='v119src/GuidedArrow/SubModule.xml'
          $t=[IO.File]::ReadAllText($sm).Replace('v1.0.13','v1.0.16').Replace('v1.0.14','v1.0.16').Replace('v1.0.15','v1.0.16')
          [IO.File]::WriteAllText($sm,$t,[Text.UTF8Encoding]::new($false))
          Push-Location v119src
          git apply --check '..\v117.patch';if($LASTEXITCODE-ne 0){throw 'v117 check failed'}
          git apply '..\v117.patch';if($LASTEXITCODE-ne 0){throw 'v117 apply failed'}
          Pop-Location
          @'
          import base64,gzip,hashlib,pathlib
          parts=sorted(pathlib.Path('GuidedArrow/v118b_payload').glob('part*.txt'))
          assert len(parts)==5,len(parts)
          e=''.join(p.read_text().strip() for p in parts)
          assert hashlib.sha256(e.encode()).hexdigest()=='41e67276da41a0e6f1e4a41612d7c17393cf60208e6317fc848d370d9761c6bc'
          r=gzip.decompress(base64.b64decode(e))
          assert hashlib.sha256(r).hexdigest()=='fc7ab9c28972ba4e250849e776bdec9c5ce369de46fa5e61efbf86c05bcb651c'
          pathlib.Path('v118.patch').write_bytes(r)
          '@ | Set-Content -Encoding UTF8 reconstruct118.py
          python reconstruct118.py
          Push-Location v119src
          git apply --check --directory=GuidedArrow '..\v118.patch';if($LASTEXITCODE-ne 0){throw 'v118 check failed'}
          git apply --directory=GuidedArrow '..\v118.patch';if($LASTEXITCODE-ne 0){throw 'v118 apply failed'}
          Pop-Location

      - name: Verify exact v1.0.18 source baseline
        shell: pwsh
        run: |
          @'
          import hashlib,pathlib
          root=pathlib.Path('v119src/GuidedArrow/Source');h=hashlib.sha256()
          for p in sorted(x for x in root.rglob('*') if x.is_file() and 'obj' not in x.parts and 'bin' not in x.parts):
              rel=p.relative_to(root).as_posix().encode();h.update(rel);h.update(b'\0');h.update(p.read_bytes());h.update(b'\0')
          d=h.hexdigest();print('v118_source_sha256='+d);assert d=='64f41c0e9cf03660a7a0a56f1f1765ed04b0ccba9eb9bb428fe545773f1e4e06'
          '@ | Set-Content -Encoding UTF8 verify118.py
          python verify118.py

      - name: Apply exact v1.0.19 patch
        shell: pwsh
        run: |
          @'
          import base64,gzip,hashlib,pathlib
          e=pathlib.Path('GuidedArrow/v119.patch.gz.b64').read_text().strip()
          eh=hashlib.sha256(e.encode()).hexdigest();print('v119_encoded_sha256='+eh);assert eh=='29e43b2f83ce3399dc70b65a4fc2fd165511c5f199381c3e8250e73eb7043bc1'
          r=gzip.decompress(base64.b64decode(e))
          rh=hashlib.sha256(r).hexdigest();print('v119_patch_sha256='+rh);assert rh=='572f5cb5102a390d382ab500e1963dd429972e58dfdca3a3d092963eace779fb'
          pathlib.Path('v119.patch').write_bytes(r)
          '@ | Set-Content -Encoding UTF8 reconstruct119.py
          python reconstruct119.py
          Push-Location v119src
          git apply --check '..\v119.patch';if($LASTEXITCODE-ne 0){throw 'v119 check failed'}
          git apply '..\v119.patch';if($LASTEXITCODE-ne 0){throw 'v119 apply failed'}
          Pop-Location

      - name: Verify exact v1.0.19 source defaults and semantics
        shell: pwsh
        run: |
          $project=Get-Content 'v119src/GuidedArrow/Source/GuidedArrow.csproj' -Raw
          $behavior=Get-Content 'v119src/GuidedArrow/Source/GuidedArrowBehavior.cs' -Raw
          $settings=Get-Content 'v119src/GuidedArrow/Source/Settings.cs' -Raw
          $submodule=Get-Content 'v119src/GuidedArrow/SubModule.xml' -Raw
          foreach($n in @('<Version>1.0.19</Version>','<FileVersion>1.0.19.0</FileVersion>','<AssemblyVersion>1.0.19.0</AssemblyVersion>')){if(-not $project.Contains($n)){throw "Missing $n"}}
          if(-not $submodule.Contains('<Version value="v1.0.19" />')){throw 'SubModule not v1.0.19'}
          foreach($n in @('hideFirstPersonCameraOwner','tracked.VisualEntity.SetVisibilityExcludeParents(!hideFirstPersonCameraOwner)','(Settings.Instance?.ProjectileCameraMode ?? 1) == 0')){if(-not $behavior.Contains($n)){throw "Missing first-person visual fix marker: $n"}}
          foreach($n in @('public bool ShowCrosshair { get; set; } = false;','public int SplitArrowFormationMode { get; set; } = 1;','public int CinematicTriggerMode { get; set; } = 1;','public int CinematicMode { get; set; } = 1;','public float MouseSensitivity { get; set; } = 0.49829796f;','public float ProximityNearTimeSpeed { get; set; } = 0.202393547f;','public float ProximityTimeResponseRate { get; set; } = 30.0f;','public float ProximityMaximumExtraSlowdown { get; set; } = 0.75f;','public float AdaptiveCinematicMaximumDuration { get; set; } = 4.0f;')){if(-not $settings.Contains($n)){throw "Missing release default marker: $n"}}
          @'
          import hashlib,pathlib
          root=pathlib.Path('v119src/GuidedArrow/Source');h=hashlib.sha256()
          for p in sorted(x for x in root.rglob('*') if x.is_file() and 'obj' not in x.parts and 'bin' not in x.parts):
              rel=p.relative_to(root).as_posix().encode();h.update(rel);h.update(b'\0');h.update(p.read_bytes());h.update(b'\0')
          d=h.hexdigest();print('v119_source_sha256='+d);pathlib.Path('source_hash.txt').write_text(d+'\n');assert d=='684de986bd377d660172f8632c63c51c635a46986371f5e643045830a8548568'
          '@ | Set-Content -Encoding UTF8 verify119.py
          python verify119.py

      - name: Restore
        shell: pwsh
        run: dotnet restore 'v119src/GuidedArrow/Source/GuidedArrow.csproj'

      - name: Build
        shell: pwsh
        run: |
          dotnet build 'v119src/GuidedArrow/Source/GuidedArrow.csproj' -c Release --no-restore 2>&1 | Tee-Object -FilePath compiler.log
          if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}

      - name: Collect exact outputs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force compiled | Out-Null
          if(Test-Path 'v119src/GuidedArrow/Source/bin/Release/net472/GuidedArrow.dll'){Copy-Item 'v119src/GuidedArrow/Source/bin/Release/net472/GuidedArrow.dll' compiled/GuidedArrow.dll}
          if(Test-Path 'v119src/GuidedArrow/Source/bin/Release/net472/GuidedArrow.pdb'){Copy-Item 'v119src/GuidedArrow/Source/bin/Release/net472/GuidedArrow.pdb' compiled/GuidedArrow.pdb}
          if(Test-Path 'v119src/GuidedArrow/Source'){Copy-Item 'v119src/GuidedArrow/Source' compiled/Source -Recurse}
          if(Test-Path 'v119src/GuidedArrow/SubModule.xml'){Copy-Item 'v119src/GuidedArrow/SubModule.xml' compiled/SubModule.xml}
          if(Test-Path compiler.log){Copy-Item compiler.log compiled/compiler.log}
          if(Test-Path source_hash.txt){Copy-Item source_hash.txt compiled/source_hash.txt}

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GuidedArrow-v1.0.19-compiled
          path: compiled
          if-no-files-found: error
