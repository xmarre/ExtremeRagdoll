name: Temporary v1.3.8 Exact Hit Bone Compiler
on:
  pull_request:
    branches: [ tmp/extremeragdoll-v138-base ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '3.1.426'

      - name: Verify and extract exact reviewed payload
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'v137_payload2/p*.txt' | Sort-Object Name
          if ($parts.Count -ne 13) { throw "Expected 13 payload parts, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { (Get-Content -Raw $_.FullName).Trim() }) -join ''
          [IO.File]::WriteAllBytes('v137_payload.zip', [Convert]::FromBase64String($b64))
          $payloadHash = (Get-FileHash 'v137_payload.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($payloadHash -ne 'e03a5bde095d4100f16502f5bde1bc002282f54a04d339bf299e218979a9c318') { throw "Payload SHA-256 mismatch: $payloadHash" }
          Expand-Archive 'v137_payload.zip' 'v138src' -Force
          $checks = @{
            'v138src/baseline.dll' = 'a822f40a8f58e1b537c3947b976e1bed39850ef93a52f41fe980718bead2105a'
            'v138src/ExtremeRagdoll.ClothSync.dll' = '04a1b4ca8a7f46514a5499ada259b8e9b6af7c4db8ac13d0c8210bd867f028f2'
            'v138src/SafeSubModule.cs' = '84e0f3fc78f455ce60ffcab905386619553a0d6c6ec550a2819a4d6eec3ed39f'
          }
          foreach ($entry in $checks.GetEnumerator()) {
            $actual = (Get-FileHash $entry.Key -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $entry.Value) { throw "Hash mismatch for $($entry.Key): $actual" }
          }

      - name: Compile donor against isolated signature stubs
        shell: pwsh
        run: |
          $dotnet = (Get-Command dotnet).Source
          $root = Split-Path -Parent $dotnet
          $sdk = (Get-ChildItem "$root/sdk" -Directory -Filter '3.1.*' | Sort-Object Name | Select-Object -Last 1).FullName
          $csc = Join-Path $sdk 'Roslyn/bincore/csc.dll'
          $refRoot = ((Get-ChildItem "$root/packs/Microsoft.NETCore.App.Ref" -Directory -Filter '3.1.*' | Sort-Object Name | Select-Object -Last 1).FullName + '/ref/netcoreapp3.1')
          $refs = Get-ChildItem $refRoot -Filter '*.dll' | ForEach-Object { "/r:$($_.FullName)" }
          New-Item -ItemType Directory -Force refs | Out-Null
          $common = @('/nologo','/noconfig','/nostdlib','/deterministic+','/optimize+','/debug-','/langversion:7.3','/target:library','/nowarn:1701')
          function C([string[]]$a) { & $dotnet $csc @common @refs @a; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          C @('/out:refs/TaleWorlds.Library.dll','v138src/ReferenceStubs/TaleWorlds.Library.Stub.cs')
          C @('/out:refs/TaleWorlds.Core.dll','v138src/ReferenceStubs/TaleWorlds.Core.Stub.cs')
          C @('/r:refs/TaleWorlds.Library.dll','/out:refs/TaleWorlds.Engine.dll','v138src/ReferenceStubs/TaleWorlds.Engine.Stub.cs')
          C @('/r:refs/TaleWorlds.Library.dll','/r:refs/TaleWorlds.Core.dll','/r:refs/TaleWorlds.Engine.dll','/out:refs/TaleWorlds.MountAndBlade.dll','v138src/ReferenceStubs/TaleWorlds.MountAndBlade.Stub.cs')
          C @('/out:refs/MCMv5.dll','v138src/ReferenceStubs/MCMv5.Stub.cs')
          C @('/r:refs/TaleWorlds.Library.dll','/r:refs/TaleWorlds.Core.dll','/r:refs/TaleWorlds.Engine.dll','/r:refs/TaleWorlds.MountAndBlade.dll','/r:refs/MCMv5.dll','/r:v138src/ExtremeRagdoll.ClothSync.dll','/out:ExtremeRagdoll.Donor.dll','v138src/SafeSubModule.cs')

      - name: Transplant only lethal-shot lifecycle methods
        shell: pwsh
        run: |
          nuget install Mono.Cecil -Version 0.11.5 -OutputDirectory packages -DirectDownload -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cecil = (Get-ChildItem 'packages/Mono.Cecil.0.11.5/lib' -Recurse -Filter 'Mono.Cecil.dll' | Where-Object { $_.FullName -match 'netstandard2.0' } | Select-Object -First 1).FullName
          if (-not $cecil) { throw 'Mono.Cecil.dll not found' }
          $dotnet = (Get-Command dotnet).Source
          $root = Split-Path -Parent $dotnet
          $sdk = (Get-ChildItem "$root/sdk" -Directory -Filter '3.1.*' | Sort-Object Name | Select-Object -Last 1).FullName
          $csc = Join-Path $sdk 'Roslyn/bincore/csc.dll'
          $refRoot = ((Get-ChildItem "$root/packs/Microsoft.NETCore.App.Ref" -Directory -Filter '3.1.*' | Sort-Object Name | Select-Object -Last 1).FullName + '/ref/netcoreapp3.1')
          $refs = Get-ChildItem $refRoot -Filter '*.dll' | ForEach-Object { "/r:$($_.FullName)" }
          & $dotnet $csc /nologo /noconfig /nostdlib /deterministic+ /optimize+ /debug- /langversion:7.3 /target:exe /nowarn:1701 @refs "/r:$cecil" '/out:TransplantMethodsFlexible.dll' 'v138src/TransplantMethodsFlexible.cs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item 'v138src/PatchOverride.runtimeconfig.json' 'TransplantMethodsFlexible.runtimeconfig.json'
          Copy-Item $cecil 'Mono.Cecil.dll'
          & $dotnet './TransplantMethodsFlexible.dll' './ExtremeRagdoll.Donor.dll' 'v138src/baseline.dll' './ExtremeRagdoll.dll' `
            'ExtremeRagdoll.SafeRuntime.SafeRagdollBehavior' 'OnTrackedAgentHealthChanged' `
            'ExtremeRagdoll.SafeRuntime.SafeRagdollBehavior' 'EnrichPendingDeath'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item 'v138src/ExtremeRagdoll.ClothSync.dll' './ExtremeRagdoll.ClothSync.dll'

      - name: Validate exact hit-bone routing regression is absent
        shell: pwsh
        run: |
          Add-Type -Path (Resolve-Path './Mono.Cecil.dll')
          function MethodFingerprint($path, $typeName, $methodName) {
            $asm = [Mono.Cecil.AssemblyDefinition]::ReadAssembly((Resolve-Path $path))
            try {
              $type = $asm.MainModule.GetType($typeName)
              if (-not $type) { throw "Missing type $typeName in $path" }
              $method = $type.Methods | Where-Object { $_.Name -eq $methodName } | Select-Object -First 1
              if (-not $method -or -not $method.HasBody) { throw "Missing method body $methodName in $path" }
              $lines = foreach ($ins in $method.Body.Instructions) {
                $operand = if ($null -eq $ins.Operand) { '' } elseif ($ins.Operand -is [Mono.Cecil.Cil.Instruction]) { 'IL_TARGET' } elseif ($ins.Operand -is [Mono.Cecil.Cil.Instruction[]]) { 'IL_TARGETS:' + $ins.Operand.Count } else { $ins.Operand.ToString() }
                "$($ins.OpCode.Code)|$operand"
              }
              return ($lines -join "`n")
            } finally { $asm.Dispose() }
          }
          $baselineTick = MethodFingerprint 'v138src/baseline.dll' 'ExtremeRagdoll.SafeRuntime.SafeRagdollBehavior' 'OnMissionTick'
          $finalTick = MethodFingerprint './ExtremeRagdoll.dll' 'ExtremeRagdoll.SafeRuntime.SafeRagdollBehavior' 'OnMissionTick'
          if ($baselineTick -ne $finalTick) { throw 'OnMissionTick changed; exact v1.3.6/v1.3.3 hit-bone routing was not preserved.' }
          $bytes = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes('./ExtremeRagdoll.dll'))
          if ($bytes.Contains('Exact-hit-bone deathblow response fallback')) { throw 'Forbidden response-fallback marker remains in final DLL.' }
          Write-Host 'OnMissionTick is instruction-identical to v1.3.6; response-based pelvis reroute is absent.'

      - name: Run existing assembly invariant validator
        shell: pwsh
        run: |
          $dotnet = (Get-Command dotnet).Source
          $root = Split-Path -Parent $dotnet
          $sdk = (Get-ChildItem "$root/sdk" -Directory -Filter '3.1.*' | Sort-Object Name | Select-Object -Last 1).FullName
          $csc = Join-Path $sdk 'Roslyn/bincore/csc.dll'
          $refRoot = ((Get-ChildItem "$root/packs/Microsoft.NETCore.App.Ref" -Directory -Filter '3.1.*' | Sort-Object Name | Select-Object -Last 1).FullName + '/ref/netcoreapp3.1')
          $refs = Get-ChildItem $refRoot -Filter '*.dll' | ForEach-Object { "/r:$($_.FullName)" }
          & $dotnet $csc /nologo /noconfig /nostdlib /deterministic+ /optimize+ /debug- /langversion:7.3 /target:exe /nowarn:1701 @refs '/r:Mono.Cecil.dll' '/out:ValidateAssemblies.dll' 'v138src/ValidateAssemblies.cs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item 'v138src/ValidateAssemblies.runtimeconfig.json' 'ValidateAssemblies.runtimeconfig.json'
          & $dotnet './ValidateAssemblies.dll' './ExtremeRagdoll.dll' './ExtremeRagdoll.ClothSync.dll'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $helper = (Get-FileHash './ExtremeRagdoll.ClothSync.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          $main = (Get-FileHash './ExtremeRagdoll.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($helper -ne '04a1b4ca8a7f46514a5499ada259b8e9b6af7c4db8ac13d0c8210bd867f028f2') { throw 'Helper DLL changed.' }
          if ($main -eq 'a822f40a8f58e1b537c3947b976e1bed39850ef93a52f41fe980718bead2105a') { throw 'Main DLL did not change.' }
          Write-Host "main_sha256=$main"
          Write-Host "helper_sha256=$helper"

      - name: Package compiler output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item ExtremeRagdoll.dll,ExtremeRagdoll.ClothSync.dll artifact/
          Get-FileHash artifact/* -Algorithm SHA256 | Sort-Object Path | Format-Table -AutoSize | Out-String | Set-Content artifact/SHA256SUMS.txt
          Compress-Archive artifact/* ExtremeRagdoll-v1.3.8-compiler-output.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ExtremeRagdoll-v1.3.8-compiler-output
          path: ExtremeRagdoll-v1.3.8-compiler-output.zip
