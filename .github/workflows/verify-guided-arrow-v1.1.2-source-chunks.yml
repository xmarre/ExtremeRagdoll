name: Verify Guided Arrow v1.1.2 Source Chunks

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source-chunk:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - file: p00.b64
            sha256: 68c6d304935d86a253aa3c09c5d0d09e308bbc3534aaa1dee4b590fd24bd80d6
          - file: p01.b64
            sha256: cdf69e9a9d405f3dc84f41d65aa6932821f75697d591c97804965259f4a5e367
          - file: p02a.b64
            sha256: cdb7332d17731e63fba24c635fb980803fbe8410c285e2d4f3d4e2b67dbcd636
          - file: p02b.b64
            sha256: 2296f4d3226231aa3416c02407d9e0ff7a36743391afe5dffd064d77c92a1777
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Verify ${{ matrix.file }}
        shell: pwsh
        run: |
          $actual = (Get-FileHash "tools/ga112source/${{ matrix.file }}" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '${{ matrix.sha256 }}') { throw "Expected ${{ matrix.sha256 }}, got $actual" }
