name: Validate Guided Arrow v1.1.0 Compatibility Matrix

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-matrix:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        bannerlord_ref:
          - 1.3.15.110062
          - 1.4.0.112726-beta
          - 1.4.1.113228-beta
          - 1.4.2.113809-beta
          - 1.4.3.114169-beta
          - 1.4.4.114449-beta
          - 1.4.5.115026
          - 1.4.6.115628
          - 1.4.7.117484
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify exact source payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem 'tools/ga110/p*.b64' | Sort-Object Name
          if ($parts.Count -ne 7) { throw "Expected 7 payload chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $zip = Join-Path $env:RUNNER_TEMP 'GuidedArrow-v1.1.0-source-ci.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '02d485f72bd1eb2da35f16d2e379a480b29fbd3a5717e2b8bfd1c174fb4fd194') {
            throw "Source payload hash mismatch: $hash"
          }
          $src = Join-Path $env:RUNNER_TEMP 'ga-src'
          Expand-Archive -LiteralPath $zip -DestinationPath $src -Force
          "GA_SRC=$src\GuidedArrow" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Retarget reference assemblies
        shell: pwsh
        env:
          BL_REF: ${{ matrix.bannerlord_ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $path = "$env:GA_SRC\Source\GuidedArrow.csproj"
          $text = Get-Content $path -Raw
          $text = $text.Replace('1.3.15.110062', $env:BL_REF)
          Set-Content -Path $path -Value $text -Encoding utf8
          Select-String -Path $path -Pattern 'Bannerlord.ReferenceAssemblies|HintPath'

      - name: Restore and compile
        shell: pwsh
        env:
          BL_REF: ${{ matrix.bannerlord_ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location "$env:GA_SRC\Source"
          try {
            dotnet restore GuidedArrow.csproj --nologo
            if ($LASTEXITCODE -ne 0) { throw "Restore failed for $env:BL_REF" }
            dotnet build GuidedArrow.csproj -c Release --no-restore --nologo /p:ContinuousIntegrationBuild=true /p:Deterministic=true
            if ($LASTEXITCODE -ne 0) { throw "Build failed for $env:BL_REF" }
          } finally { Pop-Location }
