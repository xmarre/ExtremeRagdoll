name: Build Guided Arrow v1.1.2 Authoritative

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Reconstruct verified v1.1.0 baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem 'tools/ga110/p*.b64' | Sort-Object Name
          if ($parts.Count -ne 7) { throw "Expected 7 baseline payload chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          $zip = Join-Path $env:RUNNER_TEMP 'GuidedArrow-v1.1.0-source-ci.zip'
          [IO.File]::WriteAllBytes($zip, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '02d485f72bd1eb2da35f16d2e379a480b29fbd3a5717e2b8bfd1c174fb4fd194') { throw "Baseline source payload hash mismatch: $hash" }
          $src = Join-Path $env:RUNNER_TEMP 'ga-src'
          Expand-Archive -LiteralPath $zip -DestinationPath $src -Force
          "GA_SRC=$src\GuidedArrow" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Assemble and verify minimal v1.1.2 source patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $specs = @(
            @{ Path='tools/ga112source/p00.b64'; Hash='68c6d304935d86a253aa3c09c5d0d09e308bbc3534aaa1dee4b590fd24bd80d6' },
            @{ Path='tools/ga112source/p01.b64'; Hash='cdf69e9a9d405f3dc84f41d65aa6932821f75697d591c97804965259f4a5e367' },
            @{ Path='tools/ga112source/p02a.b64'; Hash='cdb7332d17731e63fba24c635fb980803fbe8410c285e2d4f3d4e2b67dbcd636' },
            @{ Path='tools/ga112source/p02b.b64'; Hash='2296f4d3226231aa3416c02407d9e0ff7a36743391afe5dffd064d77c92a1777' }
          )
          foreach ($spec in $specs) {
            $actual = (Get-FileHash $spec.Path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $spec.Hash) { throw "Source patch chunk mismatch for $($spec.Path): $actual" }
          }
          $b64 = ($specs | ForEach-Object { (Get-Content $_.Path -Raw).Trim() }) -join ''
          $payload = Join-Path $env:RUNNER_TEMP 'ga110-to-ga112-source.patch.gz.b64'
          [IO.File]::WriteAllText($payload, $b64, [Text.UTF8Encoding]::new($false))
          if ((Get-FileHash $payload -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'fbaabec9f0926d012a2b8487315657debb60aeff8fa04ac0ec750de867cfd1d4') { throw 'Minimal v1.1.2 payload hash mismatch' }
          $compressed = [Convert]::FromBase64String($b64)
          $input = [IO.MemoryStream]::new($compressed)
          $gzip = [IO.Compression.GZipStream]::new($input, [IO.Compression.CompressionMode]::Decompress)
          $patch = Join-Path $env:RUNNER_TEMP 'ga110-to-ga112-source.patch'
          $output = [IO.File]::Create($patch)
          try { $gzip.CopyTo($output) } finally { $output.Dispose(); $gzip.Dispose(); $input.Dispose() }
          if ((Get-FileHash $patch -Algorithm SHA256).Hash.ToLowerInvariant() -ne '4f668b3502a402ea4cc1baf2c2747dc44f6da5e3906ee2b0df18ac013a68e37d') { throw 'Minimal v1.1.2 patch hash mismatch' }
          "GA_PATCH=$patch" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Validate v1.1.2 patch applicability
        shell: pwsh
        run: |
          $root = Split-Path $env:GA_SRC -Parent
          Push-Location $root
          try {
            git init | Out-Null
            git config core.autocrlf false
            git apply --check --unsafe-paths $env:GA_PATCH
            if ($LASTEXITCODE -ne 0) { throw 'Minimal v1.1.2 git apply --check failed' }
          } finally { Pop-Location }

      - name: Apply v1.1.2 source patch
        shell: pwsh
        run: |
          $root = Split-Path $env:GA_SRC -Parent
          Push-Location $root
          try {
            git apply --unsafe-paths $env:GA_PATCH
            if ($LASTEXITCODE -ne 0) { throw 'Minimal v1.1.2 git apply failed' }
          } finally { Pop-Location }

      - name: Apply Bannerlord 1.3.15 visual-position compatibility fix
        shell: pwsh
        run: |
          $checkoutPatch = (Resolve-Path 'tools/ga112-compilefix.patch').Path
          $patch = Join-Path $env:RUNNER_TEMP 'ga112-compilefix-lf.patch'
          $text = [IO.File]::ReadAllText($checkoutPatch).Replace("`r`n", "`n")
          [IO.File]::WriteAllText($patch, $text, [Text.UTF8Encoding]::new($false))
          $actual = (Get-FileHash $patch -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '44ec2c59ac832c6b737ae31328d661b3515d0454b3b96bddfc7b8613dd9d639d') { throw "Compile-fix patch mismatch: $actual" }
          $root = Split-Path $env:GA_SRC -Parent
          Push-Location $root
          try {
            git apply --check --unsafe-paths $patch
            if ($LASTEXITCODE -ne 0) { throw 'Compile-fix git apply --check failed' }
            git apply --unsafe-paths $patch
            if ($LASTEXITCODE -ne 0) { throw 'Compile-fix git apply failed' }
          } finally { Pop-Location }

      - name: Verify GuidedArrow.csproj source hash
        shell: pwsh
        run: |
          $actual = (Get-FileHash "$env:GA_SRC\Source\GuidedArrow.csproj" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne 'c961a27a61a1786a727286a0e2d63f37d44986ba4f35cec04016db838e81d54c') { throw "GuidedArrow.csproj source mismatch: $actual" }

      - name: Verify GuidedArrowBehavior.cs source hash
        shell: pwsh
        run: |
          $actual = (Get-FileHash "$env:GA_SRC\Source\GuidedArrowBehavior.cs" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '6ca94b28d2e9c18c08cb2b883d6068641751ba5dcf6cd2a77892ee82464103a8') { throw "GuidedArrowBehavior.cs source mismatch: $actual" }

      - name: Verify Settings.cs source hash
        shell: pwsh
        run: |
          $actual = (Get-FileHash "$env:GA_SRC\Source\Settings.cs" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '211259b007e904608b4339c3a52ac2dcd9d00701f98d2aff6cc60cf5d6992796') { throw "Settings.cs source mismatch: $actual" }

      - name: Verify SubModule.cs source hash
        shell: pwsh
        run: |
          $actual = (Get-FileHash "$env:GA_SRC\Source\SubModule.cs" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '31103cc6fc3d192e5164ef3ca0d2128c9026ab32c81cc45d8e9c3ffe73601bae') { throw "SubModule.cs source mismatch: $actual" }

      - name: Verify SubModule.xml source hash
        shell: pwsh
        run: |
          $actual = (Get-FileHash "$env:GA_SRC\SubModule.xml" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '38b0453a3a7f719bad6b1b8b0e4f81d89a47d178475db1e74ae1169598acaa03') { throw "SubModule.xml source mismatch: $actual" }

      - name: Restore exact Bannerlord 1.3.15 and MCM references
        shell: pwsh
        run: |
          Push-Location "$env:GA_SRC\Source"
          try {
            dotnet restore GuidedArrow.csproj --nologo 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'RESTORE_LOG.txt')
            if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed with exit code $LASTEXITCODE" }
          } finally { Pop-Location }

      - name: Build production release against Bannerlord 1.3.15
        shell: pwsh
        run: |
          Push-Location "$env:GA_SRC\Source"
          try {
            dotnet build GuidedArrow.csproj -c Release --no-restore --nologo /p:ContinuousIntegrationBuild=true /p:Deterministic=true 2>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'COMPILER_LOG.txt')
            if ($LASTEXITCODE -ne 0) { throw "dotnet build failed with exit code $LASTEXITCODE" }
          } finally { Pop-Location }

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GuidedArrow-v1.1.2-compiler-diagnostics
          path: |
            ${{ runner.temp }}\COMPILER_LOG.txt
            ${{ runner.temp }}\RESTORE_LOG.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Verify production assembly metadata and stage artifact
        shell: pwsh
        run: |
          $out = "$env:GA_SRC\Source\bin\Release\net472"
          $dll = Join-Path $out 'GuidedArrow.dll'
          $pdb = Join-Path $out 'GuidedArrow.pdb'
          if (!(Test-Path $dll)) { throw "Missing compiled DLL: $dll" }
          if (!(Test-Path $pdb)) { throw "Missing compiled PDB: $pdb" }
          $asm = [Reflection.AssemblyName]::GetAssemblyName($dll)
          if ($asm.Version.ToString() -ne '1.1.2.0') { throw "Unexpected assembly version: $($asm.Version)" }
          $vi = (Get-Item $dll).VersionInfo
          @(
            "AssemblyVersion=$($asm.Version)",
            "FileVersion=$($vi.FileVersion)",
            "ProductVersion=$($vi.ProductVersion)",
            "DLL_SHA256=$((Get-FileHash $dll -Algorithm SHA256).Hash.ToLowerInvariant())",
            "PDB_SHA256=$((Get-FileHash $pdb -Algorithm SHA256).Hash.ToLowerInvariant())"
          ) | Set-Content -Path (Join-Path $env:RUNNER_TEMP 'BUILD_METADATA.txt') -Encoding utf8
          $stage = Join-Path $env:RUNNER_TEMP 'artifact'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item $dll,$pdb -Destination $stage
          Copy-Item (Join-Path $env:RUNNER_TEMP 'COMPILER_LOG.txt'),(Join-Path $env:RUNNER_TEMP 'RESTORE_LOG.txt'),(Join-Path $env:RUNNER_TEMP 'BUILD_METADATA.txt') -Destination $stage

      - name: Validate exact v1.1.2 source against Bannerlord 1.4.7
        shell: pwsh
        run: |
          $project = "$env:GA_SRC\Source\GuidedArrow.csproj"
          $original = Get-Content $project -Raw
          try {
            $retargeted = $original.Replace('1.3.15.110062', '1.4.7.117484')
            Set-Content -Path $project -Value $retargeted -Encoding utf8
            Push-Location "$env:GA_SRC\Source"
            try {
              dotnet restore GuidedArrow.csproj --nologo
              if ($LASTEXITCODE -ne 0) { throw '1.4.7 restore failed' }
              dotnet build GuidedArrow.csproj -c Release --no-restore --nologo /p:ContinuousIntegrationBuild=true /p:Deterministic=true
              if ($LASTEXITCODE -ne 0) { throw '1.4.7 build failed' }
            } finally { Pop-Location }
          } finally {
            [IO.File]::WriteAllText($project, $original, [Text.UTF8Encoding]::new($false))
          }

      - name: Upload compiled artifact
        uses: actions/upload-artifact@v4
        with:
          name: GuidedArrow-v1.1.2-compiled-authoritative
          path: ${{ runner.temp }}\artifact
          if-no-files-found: error
          retention-days: 7
