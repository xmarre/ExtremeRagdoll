name: Apply and verify deathblow direction fix

on:
  pull_request:
    branches:
      - master
    paths:
      - Source/Build/apply_direction_fix.py
      - .github/workflows/apply-v1.3.12-direction-fix.yml
  push:
    branches:
      - agent/fix-deathblow-direction
    paths:
      - Source/Build/apply_direction_fix.py
      - .github/workflows/apply-v1.3.12-direction-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2022

    steps:
      - name: Check out fix branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-deathblow-direction
          fetch-depth: 0

      - name: Install .NET Core SDK 3.1
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 3.1.426

      - name: Apply exact scoped patch
        shell: pwsh
        run: python .\Source\Build\apply_direction_fix.py

      - name: Build and validate assemblies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'ExtremeRagdollDirectionFix'
          .\Source\Build\build.ps1 -OutDir $out
          New-Item -ItemType Directory -Force '.\bin\Win64_Shipping_Client' | Out-Null
          Copy-Item "$out\bin\ExtremeRagdoll.dll" '.\bin\Win64_Shipping_Client\ExtremeRagdoll.dll' -Force
          Copy-Item "$out\bin\ExtremeRagdoll.ClothSync.dll" '.\bin\Win64_Shipping_Client\ExtremeRagdoll.ClothSync.dll' -Force

          $main = (Get-FileHash '.\bin\Win64_Shipping_Client\ExtremeRagdoll.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          $helper = (Get-FileHash '.\bin\Win64_Shipping_Client\ExtremeRagdoll.ClothSync.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = @(
            "$main  bin/Win64_Shipping_Client/ExtremeRagdoll.dll"
            "$helper  bin/Win64_Shipping_Client/ExtremeRagdoll.ClothSync.dll"
          ) -join "`n"
          [System.IO.File]::WriteAllText(
            (Join-Path $PWD 'RUNTIME_SHA256.txt'),
            $manifest + "`n",
            [System.Text.Encoding]::ASCII)

      - name: Review generated scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          git diff --stat
          $allowed = @(
            'Source/SafeSubModule.cs',
            'Source/ClothForceBridge.cs',
            'Source/Build/ValidateAssemblies.cs',
            'bin/Win64_Shipping_Client/ExtremeRagdoll.dll',
            'bin/Win64_Shipping_Client/ExtremeRagdoll.ClothSync.dll',
            'RUNTIME_SHA256.txt'
          )
          $changed = @(git diff --name-only)
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw "Unexpected generated changes: $($unexpected -join ', ')"
          }

      - name: Commit verified fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- Source/SafeSubModule.cs Source/ClothForceBridge.cs Source/Build/ValidateAssemblies.cs bin/Win64_Shipping_Client RUNTIME_SHA256.txt
          git rm -- Source/Build/apply_direction_fix.py .github/workflows/apply-v1.3.12-direction-fix.yml
          git commit -m 'Fix reversed deathblow directions'
          git push origin HEAD:agent/fix-deathblow-direction
