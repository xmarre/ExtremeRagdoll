name: Temporary Extreme Ragdoll v1.3.10 Compiler

on:
  push:
    branches: ['tmp/extremeragdoll-v1310-*']
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Reconstruct payload diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force diagnostic | Out-Null
          $parts = Get-ChildItem 'v1310_payload2/p*.txt' | Sort-Object Name
          "count=$($parts.Count)" | Set-Content diagnostic/report.txt
          $builder = New-Object Text.StringBuilder
          foreach ($part in $parts) {
            $raw = [IO.File]::ReadAllText($part.FullName)
            $trimmed = $raw.Trim()
            "$($part.Name) raw=$($raw.Length) trimmed=$($trimmed.Length) file_sha=$((Get-FileHash $part.FullName -Algorithm SHA256).Hash.ToLowerInvariant())" | Add-Content diagnostic/report.txt
            [void]$builder.Append($trimmed)
          }
          try {
            $b64 = $builder.ToString()
            "base64_chars=$($b64.Length)" | Add-Content diagnostic/report.txt
            [IO.File]::WriteAllBytes('payload.zip', [Convert]::FromBase64String($b64))
            $zipHash = (Get-FileHash 'payload.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
            "zip_bytes=$((Get-Item payload.zip).Length) zip_sha=$zipHash" | Add-Content diagnostic/report.txt
            Expand-Archive 'payload.zip' 'payload' -Force
            "extracted=true" | Add-Content diagnostic/report.txt
          } catch {
            "error=$($_.Exception.ToString())" | Add-Content diagnostic/report.txt
          }

      - uses: actions/upload-artifact@v4
        with:
          name: v1310-transport-diagnostic
          path: diagnostic/*
          if-no-files-found: error

      - name: Verify exact reviewed payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path payload.zip)) { throw 'Payload ZIP was not reconstructed.' }
          $zipHash = (Get-FileHash 'payload.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($zipHash -ne '6cb3e11f3afce16a2a3db16c0f38041e847917553a65e133a8e4ec5b0ea39b57') { throw "ZIP mismatch: $zipHash" }
          if (-not (Test-Path 'payload/v1310_payload_stage/Source/SafeSubModule.cs')) { throw 'Reviewed source was not extracted.' }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '3.1.426'

      - name: Compile, validate, and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Resolve-Path 'payload/v1310_payload_stage').Path
          nuget install Mono.Cecil -Version 0.11.5 -OutputDirectory packages -DirectDownload -NonInteractive
          $cecil = (Resolve-Path 'packages/Mono.Cecil.0.11.5/lib/netstandard2.0/Mono.Cecil.dll').Path
          New-Item -ItemType Directory -Force "$root/Source/Build/Tools" | Out-Null
          Copy-Item $cecil "$root/Source/Build/Tools/Mono.Cecil.dll" -Force
          $dotnet = (Get-Command dotnet).Source
          $env:DOTNET = $dotnet
          $env:DOTNET_ROOT = Split-Path -Parent $dotnet
          & "$root/Source/Build/build.ps1" './build'
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed: $LASTEXITCODE" }
          if (-not (Test-Path 'build/bin/ExtremeRagdoll.dll')) { throw 'Missing ExtremeRagdoll.dll.' }
          if (-not (Test-Path 'build/bin/ExtremeRagdoll.ClothSync.dll')) { throw 'Missing ExtremeRagdoll.ClothSync.dll.' }

          Get-ChildItem $root -Recurse -Filter '*.xml' | ForEach-Object { [xml](Get-Content $_.FullName -Raw) | Out-Null }
          $source = Get-Content "$root/Source/SafeSubModule.cs" -Raw
          $english = Get-Content "$root/ModuleData/Languages/std_module_strings_xml.xml" -Raw
          $chinese = Get-Content "$root/ModuleData/Languages/CNs/std_module_strings_xml.xml" -Raw
          $ids = [regex]::Matches($source, '\{=([A-Za-z0-9_]+)\}') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          foreach ($id in $ids) {
            if ($english -notmatch [regex]::Escape("id=\"$id\"")) { throw "Missing English id: $id" }
            if ($chinese -notmatch [regex]::Escape("id=\"$id\"")) { throw "Missing Chinese id: $id" }
          }
          if ($source -notmatch 'CompatibilityState\.IsDismembermentPlusLoaded') { throw 'Missing DP detection.' }
          if ($source -notmatch '!_dismembermentPlusCompatibility') { throw 'Missing DP nonlethal guard.' }
          if ($source -notmatch 'Do not invoke EndRagdollAsCorpse against that live visual') { throw 'Missing Active-corpse guard.' }

          Remove-Item clean,full,artifact -Recurse -Force -ErrorAction SilentlyContinue
          $clean = 'clean/ExtremeRagdoll'
          New-Item -ItemType Directory -Force "$clean/bin/Win64_Shipping_Client","$clean/ModuleData" | Out-Null
          Copy-Item 'build/bin/ExtremeRagdoll.dll','build/bin/ExtremeRagdoll.ClothSync.dll' "$clean/bin/Win64_Shipping_Client"
          Copy-Item "$root/SubModule.xml","$root/V1.3.10_CHANGES.txt","$root/V1.3.10_ROOT_CAUSE_AND_SCOPE.txt","$root/SETTINGS_GUIDE.txt" $clean
          Copy-Item "$root/ModuleData/*" "$clean/ModuleData" -Recurse

          $full = 'full/ExtremeRagdoll'
          New-Item -ItemType Directory -Force $full | Out-Null
          Copy-Item "$root/*" $full -Recurse
          New-Item -ItemType Directory -Force "$full/bin/Win64_Shipping_Client" | Out-Null
          Copy-Item 'build/bin/ExtremeRagdoll.dll','build/bin/ExtremeRagdoll.ClothSync.dll' "$full/bin/Win64_Shipping_Client" -Force

          foreach ($dir in @($clean,$full)) {
            $base = (Resolve-Path $dir).Path
            Get-ChildItem $dir -Recurse -File | Sort-Object FullName | ForEach-Object {
              "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.FullName.Substring($base.Length + 1).Replace('\\','/')
            } | Set-Content "$dir/SHA256SUMS.txt" -Encoding UTF8
          }

          New-Item -ItemType Directory -Force artifact | Out-Null
          Compress-Archive 'clean/*' 'artifact/ExtremeRagdoll-v1.3.10-DP-COMPAT-CNs-CLEAN.zip' -Force
          Compress-Archive 'full/*' 'artifact/ExtremeRagdoll-v1.3.10-DP-COMPAT-CNs-FULL-SOURCE.zip' -Force
          Get-ChildItem 'artifact/*.zip' | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content 'artifact/SHA256SUMS.txt' -Encoding UTF8

      - uses: actions/upload-artifact@v4
        with:
          name: ExtremeRagdoll-v1.3.10-builds
          path: artifact/*
          if-no-files-found: error
