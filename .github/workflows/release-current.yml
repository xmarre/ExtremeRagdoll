name: Publish and verify Extreme Ragdoll v1.3.18

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/release-current.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    env:
      TAG_NAME: v1.3.18
      RELEASE_NAME: Extreme Ragdoll v1.3.18
      TARGET_COMMIT: ${{ github.sha }}
      ASSET_NAME: ExtremeRagdoll-v1.3.18-Bannerlord-1.3.15-to-1.4.8.zip

    steps:
      - name: Check out immutable release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install .NET Core SDK 3.1
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 3.1.426

      - name: Verify module and compatibility implementation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          [xml]$module = Get-Content '.\SubModule.xml' -Raw
          if ($module.Module.Version.value -ne $env:TAG_NAME) {
            throw "SubModule.xml reports $($module.Module.Version.value), expected $($env:TAG_NAME)."
          }
          if ($module.Module.SubModules.SubModule.SubModuleClassType.value -ne 'ExtremeRagdoll.CompatibleLocalizedSubModule') {
            throw "Unexpected runtime entry point: $($module.Module.SubModules.SubModule.SubModuleClassType.value)"
          }

          $entrySource = Get-Content '.\Source\CompatibleLocalizedSubModule.cs' -Raw
          foreach ($requiredMarker in @(
            'TryInstallLocalizationPatches("OnSubModuleLoad")',
            'TryInstallLocalizationPatches("OnBeforeInitialModuleScreenSetAsRoot")',
            'TryInstallLocalizationPatches("OnMissionBehaviorInitialize")',
            'RegisterBlowCompatibility.EnsureInstalled()',
            'IsCombatMission(mission)')) {
            if (-not $entrySource.Contains($requiredMarker)) {
              throw "Compatible entry point is missing required marker: $requiredMarker"
            }
          }
          if ($entrySource.Contains('AppDomain.CurrentDomain.AssemblyLoad') -or
              $entrySource.Contains('OnMissionTick') -or
              $entrySource.Contains('OnApplicationTick') -or
              $entrySource.Contains('System.Threading.Timer')) {
            throw 'Active compatibility entry point must remain bounded to normal lifecycle callbacks.'
          }

          $registerSource = Get-Content '.\Source\RegisterBlowCompatibility.cs' -Raw
          foreach ($requiredMarker in @(
            'OnRegisterBlowPrefix',
            'FindCompatibleTargets',
            'OnRegisterBlowCompat(',
            'health/state/removal death fallbacks remain active')) {
            if (-not $registerSource.Contains($requiredMarker)) {
              throw "Register-blow compatibility source is missing required marker: $requiredMarker"
            }
          }
          if ($registerSource.Contains('AppDomain.CurrentDomain.AssemblyLoad') -or
              $registerSource.Contains('OnMissionTick') -or
              $registerSource.Contains('OnApplicationTick') -or
              $registerSource.Contains('System.Threading.Timer')) {
            throw 'Register-blow compatibility must remain bounded and event-free outside the patched callback.'
          }

      - name: Build and verify release runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $env:RUNNER_TEMP 'ExtremeRagdollReleaseBuild'
          .\Source\Build\build.ps1 -OutDir $out
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed with exit code $LASTEXITCODE." }

          $builtMain = (Get-FileHash (Join-Path $out 'bin/ExtremeRagdoll.dll') -Algorithm SHA256).Hash.ToLowerInvariant()
          $builtHelper = (Get-FileHash (Join-Path $out 'bin/ExtremeRagdoll.ClothSync.dll') -Algorithm SHA256).Hash.ToLowerInvariant()
          $committedMain = (Get-FileHash '.\bin\Win64_Shipping_Client\ExtremeRagdoll.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          $committedHelper = (Get-FileHash '.\bin\Win64_Shipping_Client\ExtremeRagdoll.ClothSync.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($builtMain -ne $committedMain) { throw "Main DLL differs from committed runtime. built=$builtMain committed=$committedMain" }
          if ($builtHelper -ne $committedHelper) { throw "ClothSync DLL differs from committed runtime. built=$builtHelper committed=$committedHelper" }

          $expectedManifest = @(
            "$builtMain  bin/Win64_Shipping_Client/ExtremeRagdoll.dll"
            "$builtHelper  bin/Win64_Shipping_Client/ExtremeRagdoll.ClothSync.dll"
          )
          $actualManifest = @(Get-Content '.\RUNTIME_SHA256.txt' | Where-Object { $_.Trim().Length -gt 0 })
          if (($actualManifest -join "`n") -ne ($expectedManifest -join "`n")) {
            throw 'RUNTIME_SHA256.txt does not describe the freshly rebuilt assemblies.'
          }

          "RELEASE_BUILD_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MAIN_DLL_SHA256=$builtMain" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HELPER_DLL_SHA256=$builtHelper" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate Bannerlord 1.4.7 API compatibility
        shell: pwsh
        run: |
          .\Source\Build\inspect-bannerlord-1.4.7.ps1 -RuntimeAssembly (Join-Path $env:RELEASE_BUILD_OUT 'bin/ExtremeRagdoll.dll')
          if ($LASTEXITCODE -ne 0) { throw "Bannerlord 1.4.7 API probe failed with exit code $LASTEXITCODE." }

      - name: Package installable module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'ExtremeRagdollRelease'
          $moduleRoot = Join-Path $releaseRoot 'ExtremeRagdoll'
          $moduleBin = Join-Path $moduleRoot 'bin/Win64_Shipping_Client'
          New-Item -ItemType Directory -Path $moduleBin -Force | Out-Null

          Copy-Item '.\SubModule.xml' $moduleRoot -Force
          Copy-Item '.\ModuleData' $moduleRoot -Recurse -Force
          Copy-Item (Join-Path $env:RELEASE_BUILD_OUT 'bin/ExtremeRagdoll.dll') $moduleBin -Force
          Copy-Item (Join-Path $env:RELEASE_BUILD_OUT 'bin/ExtremeRagdoll.ClothSync.dll') $moduleBin -Force

          $assetPath = Join-Path $env:GITHUB_WORKSPACE $env:ASSET_NAME
          Compress-Archive -LiteralPath $moduleRoot -DestinationPath $assetPath -CompressionLevel Optimal -Force
          $assetHash = (Get-FileHash $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = Join-Path $env:GITHUB_WORKSPACE "$($env:ASSET_NAME).sha256"
          [System.IO.File]::WriteAllText($checksumPath, "$assetHash  $($env:ASSET_NAME)`n", [System.Text.Encoding]::ASCII)
          "ASSET_SHA256=$assetHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Write release notes
        shell: pwsh
        run: |
          $notes = @'
          ## Extreme Ragdoll v1.3.18

          Bannerlord 1.4.8 forward-compatibility hardening, building on the v1.3.17 Bannerlord 1.4.7 battle-start crash fix.

          **Targeted Bannerlord versions:** v1.3.15–v1.4.8  
          **Required:** Harmony and Mod Configuration Menu v5

          ### Changes

          - Preserves the v1.3.17 fix that moved MCM localization installation out of the re-entrant `AppDomain.AssemblyLoad` path and into bounded Bannerlord lifecycle callbacks.
          - Removes the hard CLR dependency on one exact `MissionBehavior.OnRegisterBlow` callback signature.
          - Discovers compatible `OnRegisterBlow` callbacks at runtime and dispatches available hit context through a reflection-only Harmony bridge.
          - Keeps existing health/state/removal death tracking available if a future callback shape cannot be bound or dispatched.
          - Installs the register-blow compatibility bridge only for real combat missions; `NoCombat`/tableau missions stay outside this patch path.
          - Preserves ragdoll forces, death direction, corpse finalization, Dismemberment Plus safeguards, campaign behavior, and per-tick behavior.

          ### Bannerlord 1.4.8 status

          The runtime is deliberately hardened for v1.4.8 by removing the known brittle callback ABI dependency. Native v1.4.8 gameplay could not be executed by the maintainer, so real in-game reports remain useful. The release build is fully validated against the published Bannerlord 1.4.7 reference assemblies and all deterministic runtime/source integrity checks.

          ### Versioning note

          The existing Nexus Mods v1.3.17 package remains the authoritative v1.3.17 build. It contains the Bannerlord 1.4.7 crash fix but not this 1.4.8 forward-compatibility work. The latter is intentionally versioned as v1.3.18 so two different runtimes are never published under the same version number.

          ### Installation

          1. Remove the existing `ExtremeRagdoll` module folder.
          2. Extract the included `ExtremeRagdoll` folder into Bannerlord's `Modules` directory.
          3. Ensure Harmony and MCM v5 are installed.
          4. Enable **Extreme Ragdoll** in the launcher or BLSE and restart the game fully.

          Use the attached `ExtremeRagdoll-v1.3.18-Bannerlord-1.3.15-to-1.4.8.zip` for installation. GitHub's automatically generated source archives are source snapshots.
          '@
          $notes = $notes.Trim() + "`n`n### Build integrity`n`n"
          $notes += "- `ExtremeRagdoll.dll`: ``$($env:MAIN_DLL_SHA256)```n"
          $notes += "- `ExtremeRagdoll.ClothSync.dll`: ``$($env:HELPER_DLL_SHA256)```n"
          $notes += "- Installable ZIP: ``$($env:ASSET_SHA256)```n"
          [System.IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE 'release-notes.md'), $notes, [System.Text.UTF8Encoding]::new($false))

      - name: Publish GitHub release when missing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view $env:TAG_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $($env:TAG_NAME) already exists; publication is a no-op."
            exit 0
          }

          $existingTag = git ls-remote --tags origin "refs/tags/$($env:TAG_NAME)"
          if ($LASTEXITCODE -ne 0) { throw "git ls-remote failed with exit code $LASTEXITCODE." }
          if ($existingTag) { throw "Tag $($env:TAG_NAME) already exists without a release; refusing to reuse it automatically." }

          gh release create $env:TAG_NAME `
            $env:ASSET_NAME `
            "$($env:ASSET_NAME).sha256" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:TARGET_COMMIT `
            --title $env:RELEASE_NAME `
            --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE." }

      - name: Verify published release and assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = gh release view $env:TAG_NAME --repo $env:GITHUB_REPOSITORY --json url,tagName,name,isDraft,isPrerelease,targetCommitish,assets | ConvertFrom-Json
          if ($metadata.tagName -ne $env:TAG_NAME) { throw "Unexpected release tag: $($metadata.tagName)" }
          if ($metadata.name -ne $env:RELEASE_NAME) { throw "Unexpected release name: $($metadata.name)" }
          if ($metadata.isDraft -or $metadata.isPrerelease) { throw 'Release must be a normal published release.' }
          if ($metadata.targetCommitish -ne $env:TARGET_COMMIT) { throw "Release targets $($metadata.targetCommitish), expected $($env:TARGET_COMMIT)." }

          $checksumName = "$($env:ASSET_NAME).sha256"
          $assetNames = @($metadata.assets | ForEach-Object { $_.name })
          foreach ($required in @($env:ASSET_NAME, $checksumName)) {
            if ($assetNames -notcontains $required) { throw "Release asset is missing: $required" }
          }

          $downloadRoot = Join-Path $env:RUNNER_TEMP 'PublishedRelease'
          New-Item -ItemType Directory -Path $downloadRoot -Force | Out-Null
          gh release download $env:TAG_NAME --repo $env:GITHUB_REPOSITORY --pattern $env:ASSET_NAME --dir $downloadRoot
          gh release download $env:TAG_NAME --repo $env:GITHUB_REPOSITORY --pattern $checksumName --dir $downloadRoot

          $downloadedAsset = Join-Path $downloadRoot $env:ASSET_NAME
          $downloadedChecksum = Join-Path $downloadRoot $checksumName
          $publishedHash = (Get-FileHash $downloadedAsset -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($publishedHash -ne $env:ASSET_SHA256) { throw "Published ZIP differs from packaged release. actual=$publishedHash expected=$($env:ASSET_SHA256)" }
          $checksumLine = (Get-Content $downloadedChecksum -Raw).Trim()
          if ($checksumLine -ne "$publishedHash  $($env:ASSET_NAME)") { throw 'Published checksum file does not match the release ZIP.' }

          $extractRoot = Join-Path $env:RUNNER_TEMP 'PublishedReleaseExtracted'
          Expand-Archive -LiteralPath $downloadedAsset -DestinationPath $extractRoot -Force
          $moduleRoot = Join-Path $extractRoot 'ExtremeRagdoll'
          [xml]$releasedModule = Get-Content (Join-Path $moduleRoot 'SubModule.xml') -Raw
          if ($releasedModule.Module.Version.value -ne $env:TAG_NAME) { throw 'Published module reports the wrong version.' }
          if ($releasedModule.Module.SubModules.SubModule.SubModuleClassType.value -ne 'ExtremeRagdoll.CompatibleLocalizedSubModule') { throw 'Published module uses the wrong runtime entry point.' }
          $releasedMain = (Get-FileHash (Join-Path $moduleRoot 'bin/Win64_Shipping_Client/ExtremeRagdoll.dll') -Algorithm SHA256).Hash.ToLowerInvariant()
          $releasedHelper = (Get-FileHash (Join-Path $moduleRoot 'bin/Win64_Shipping_Client/ExtremeRagdoll.ClothSync.dll') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($releasedMain -ne $env:MAIN_DLL_SHA256) { throw 'Published main DLL differs from verified source build.' }
          if ($releasedHelper -ne $env:HELPER_DLL_SHA256) { throw 'Published helper DLL differs from verified source build.' }

          Write-Host "Verified release: $($metadata.url)"
          Write-Host "Installable ZIP SHA-256: $publishedHash"
