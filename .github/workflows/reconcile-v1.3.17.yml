name: Reconcile Extreme Ragdoll v1.3.17

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/reconcile-v1.3.17.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: windows-2022
    env:
      TAG_NAME: v1.3.17
      RELEASE_NAME: Extreme Ragdoll v1.3.17
      TARGET_COMMIT: b5db4939fcfcfb6178a4c0f013e3053d73b2a385
      ASSET_NAME: ExtremeRagdoll-v1.3.17-Bannerlord-1.3.15-to-1.4.7.zip
      EXPECTED_MAIN_SHA256: 4ab5693747838d8e5f250bc857c24b40aa3cc785ec196a6f1ed633e94346c024
      EXPECTED_HELPER_SHA256: 5a8ec4d1c79f9c0ebb1770a3e80aa7a90fea325525bb0c4904e5a2f2cadf32c0

    steps:
      - name: Check out authoritative v1.3.17 source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_COMMIT }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify historical Nexus runtime identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$module = Get-Content '.\SubModule.xml' -Raw
          if ($module.Module.Version.value -ne $env:TAG_NAME) { throw "Historical source reports $($module.Module.Version.value), expected $($env:TAG_NAME)." }
          if ($module.Module.SubModules.SubModule.SubModuleClassType.value -ne 'ExtremeRagdoll.CompatibleLocalizedSubModule') { throw 'Historical v1.3.17 entry point is not CompatibleLocalizedSubModule.' }
          $main = (Get-FileHash '.\bin\Win64_Shipping_Client\ExtremeRagdoll.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          $helper = (Get-FileHash '.\bin\Win64_Shipping_Client\ExtremeRagdoll.ClothSync.dll' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($main -ne $env:EXPECTED_MAIN_SHA256) { throw "Unexpected v1.3.17 main DLL: $main" }
          if ($helper -ne $env:EXPECTED_HELPER_SHA256) { throw "Unexpected v1.3.17 helper DLL: $helper" }

      - name: Package authoritative v1.3.17 module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseRoot = Join-Path $env:RUNNER_TEMP 'ExtremeRagdollHistoricalRelease'
          $moduleRoot = Join-Path $releaseRoot 'ExtremeRagdoll'
          $moduleBin = Join-Path $moduleRoot 'bin/Win64_Shipping_Client'
          New-Item -ItemType Directory -Path $moduleBin -Force | Out-Null
          Copy-Item '.\SubModule.xml' $moduleRoot -Force
          Copy-Item '.\ModuleData' $moduleRoot -Recurse -Force
          Copy-Item '.\bin\Win64_Shipping_Client\ExtremeRagdoll.dll' $moduleBin -Force
          Copy-Item '.\bin\Win64_Shipping_Client\ExtremeRagdoll.ClothSync.dll' $moduleBin -Force
          $assetPath = Join-Path $env:GITHUB_WORKSPACE $env:ASSET_NAME
          Compress-Archive -LiteralPath $moduleRoot -DestinationPath $assetPath -CompressionLevel Optimal -Force
          $assetHash = (Get-FileHash $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText((Join-Path $env:GITHUB_WORKSPACE "$($env:ASSET_NAME).sha256"), "$assetHash  $($env:ASSET_NAME)`n", [System.Text.Encoding]::ASCII)
          "ASSET_SHA256=$assetHash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Write corrected v1.3.17 release notes
        shell: pwsh
        run: |
          $notes = @'
          ## Extreme Ragdoll v1.3.17

          Bannerlord 1.4.7 battle-start compatibility fix.

          **Targeted Bannerlord versions:** v1.3.15–v1.4.7  
          **Required:** Harmony and Mod Configuration Menu v5

          ### Changes

          - Fixes the Bannerlord 1.4.7 battle-start hard crash introduced by v1.3.16's deferred MCM localization installer.
          - Removes localization patch installation from the active `AppDomain.AssemblyLoad` path.
          - Prevents Harmony dynamic patch assemblies from re-entering localization installation before completion.
          - Retries localization integration only from bounded Bannerlord startup and mission-initialization lifecycle callbacks.
          - Preserves complete Simplified Chinese MCM localization when the required MCM UI types are available.
          - Adds no ragdoll force, direction, corpse-finalization, campaign, or per-tick behavior changes.

          This is the GitHub counterpart of the existing Nexus Mods v1.3.17 package. Bannerlord 1.4.8 forward-compatibility work is released separately as v1.3.18.
          '@
          $notes = $notes.Trim() + "`n`n### Build identity`n`n"
          $notes += "- `ExtremeRagdoll.dll`: ``$($env:EXPECTED_MAIN_SHA256)```n"
          $notes += "- `ExtremeRagdoll.ClothSync.dll`: ``$($env:EXPECTED_HELPER_SHA256)```n"
          $notes += "- Installable ZIP: ``$($env:ASSET_SHA256)```n"
          [System.IO.File]::WriteAllText('release-notes.md', $notes, [System.Text.UTF8Encoding]::new($false))

      - name: Restore authoritative v1.3.17 tag
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git tag -f $env:TAG_NAME $env:TARGET_COMMIT
          git push origin "refs/tags/$($env:TAG_NAME)" --force
          if ($LASTEXITCODE -ne 0) { throw 'Failed to restore v1.3.17 tag.' }

      - name: Publish authoritative GitHub v1.3.17 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view $env:TAG_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $env:TAG_NAME --repo $env:GITHUB_REPOSITORY --yes
            if ($LASTEXITCODE -ne 0) { throw 'Failed to remove stale v1.3.17 release metadata.' }
          }
          gh release create $env:TAG_NAME `
            $env:ASSET_NAME `
            "$($env:ASSET_NAME).sha256" `
            --repo $env:GITHUB_REPOSITORY `
            --verify-tag `
            --title $env:RELEASE_NAME `
            --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish authoritative GitHub v1.3.17 release.' }

      - name: Verify corrected release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = gh release view $env:TAG_NAME --repo $env:GITHUB_REPOSITORY --json tagName,name,isDraft,isPrerelease,targetCommitish,assets,url | ConvertFrom-Json
          if ($metadata.tagName -ne $env:TAG_NAME) { throw 'Corrected release tag mismatch.' }
          if ($metadata.isDraft -or $metadata.isPrerelease) { throw 'Corrected v1.3.17 must be a normal published release.' }
          $assetNames = @($metadata.assets | ForEach-Object { $_.name })
          if ($assetNames -notcontains $env:ASSET_NAME) { throw 'Corrected v1.3.17 ZIP is missing.' }
          if ($assetNames -notcontains "$($env:ASSET_NAME).sha256") { throw 'Corrected v1.3.17 checksum is missing.' }
          $downloadRoot = Join-Path $env:RUNNER_TEMP 'VerifyHistoricalRelease'
          New-Item -ItemType Directory -Path $downloadRoot -Force | Out-Null
          gh release download $env:TAG_NAME --repo $env:GITHUB_REPOSITORY --pattern $env:ASSET_NAME --dir $downloadRoot
          $zip = Join-Path $downloadRoot $env:ASSET_NAME
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:ASSET_SHA256) { throw 'Corrected published v1.3.17 ZIP differs from the verified package.' }
          $extract = Join-Path $env:RUNNER_TEMP 'VerifyHistoricalExtract'
          Expand-Archive $zip -DestinationPath $extract -Force
          $releasedMain = (Get-FileHash (Join-Path $extract 'ExtremeRagdoll/bin/Win64_Shipping_Client/ExtremeRagdoll.dll') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($releasedMain -ne $env:EXPECTED_MAIN_SHA256) { throw "Published v1.3.17 contains the wrong runtime: $releasedMain" }
          Write-Host "Verified authoritative v1.3.17 release: $($metadata.url)"
