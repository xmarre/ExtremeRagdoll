name: Temporary Extreme Ragdoll v1.3.7 Compiler
on:
  pull_request:
    branches: [ master ]

jobs:
  build:
    if: startsWith(github.head_ref, 'tmp/extremeragdoll-v137-')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '3.1.426'
      - name: Reconstruct and verify source payload
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'ExtremeRagdoll/v137_payload/part*.txt' | Sort-Object Name
          if ($parts.Count -ne 6) { throw "Expected 6 payload parts, found $($parts.Count)" }
          $expectedPartHashes = @(
            '59288d95741425e2c47f8daa261139c2000c948c3ec64d77d985f36769c67cd6',
            '14a30cc1a37c2d236c4820093d37e3d27d650da120fcd1aff533919437d53e8d',
            '53d4991b34546a88b617357c1480fdfbefab798d3e7b8843da15822917bc860e',
            'c9223b743359e18aef6a847cd11238d25d3222d6a8775ae0642be23d52119ee9',
            'ea102f6098124429c64599c4061151f78a190a20f5110fae9a01d8bb261ff3ae',
            '80c3b1253fff722e5c2e1d25ca409630b045fcc1cfffa49e4651eab4d418f358'
          )
          $b64 = ''
          for ($i = 0; $i -lt $parts.Count; $i++) {
            $text = (Get-Content -Raw $parts[$i].FullName).Trim()
            $hash = [BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash([Text.Encoding]::UTF8.GetBytes($text))).Replace('-','').ToLowerInvariant()
            if ($hash -ne $expectedPartHashes[$i]) { throw "Part $i hash mismatch: $hash" }
            $b64 += $text
          }
          [IO.File]::WriteAllBytes('v137_source.zip', [Convert]::FromBase64String($b64))
          $archiveHash = (Get-FileHash 'v137_source.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Source archive SHA-256: $archiveHash"
          if ($archiveHash -ne '00480f9ab815fca4961d3113688f21865c589306c064ad77820ba4504ba4fb28') { throw "Source archive mismatch: $archiveHash" }
          Expand-Archive -Path 'v137_source.zip' -DestinationPath 'v137src' -Force
      - name: Build semantic candidate
        shell: pwsh
        run: |
          $dotnet = (Get-Command dotnet).Source
          $env:DOTNET_ROOT = Split-Path -Parent $dotnet
          & 'v137src/ExtremeRagdoll/Source/Build/build.ps1' -OutDir "$PWD/v137build"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Transplant only v1.3.7 changed methods onto exact v1.3.6 binary
        shell: pwsh
        run: |
          $dotnet = (Get-Command dotnet).Source
          $root = Split-Path -Parent $dotnet
          $sdk = (Get-ChildItem "$root/sdk" -Directory -Filter '3.1.*' | Sort-Object Name | Select-Object -Last 1).FullName
          $csc = Join-Path $sdk 'Roslyn/bincore/csc.dll'
          $refRoot = ((Get-ChildItem "$root/packs/Microsoft.NETCore.App.Ref" -Directory -Filter '3.1.*' | Sort-Object Name | Select-Object -First 1).FullName + '/ref/netcoreapp3.1')
          $refs = Get-ChildItem $refRoot -Filter '*.dll' | ForEach-Object { "/r:$($_.FullName)" }
          $cecil = 'v137src/ExtremeRagdoll/Source/Build/Tools/Mono.Cecil.dll'
          $tool = "$PWD/TransplantMethodsFlexible.dll"
          & $dotnet $csc /nologo /noconfig /nostdlib /deterministic+ /optimize+ /debug- /langversion:7.3 /target:exe /nowarn:1701 @refs "/r:$cecil" "/out:$tool" 'v137src/ExtremeRagdoll/Source/Build/TransplantMethodsFlexible.cs'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item 'v137src/ExtremeRagdoll/Source/Build/PatchOverride.runtimeconfig.json' "$PWD/TransplantMethodsFlexible.runtimeconfig.json"
          Copy-Item $cecil "$PWD/Mono.Cecil.dll"
          $candidate = "$PWD/v137build/bin/ExtremeRagdoll.dll"
          $baseline = 'v137src/ExtremeRagdoll/bin/Win64_Shipping_Client/ExtremeRagdoll.dll'
          $output = "$PWD/ExtremeRagdoll.dll"
          & $dotnet $tool $candidate $baseline $output `
            'ExtremeRagdoll.SafeRuntime.SafeRagdollBehavior' 'OnTrackedAgentHealthChanged' `
            'ExtremeRagdoll.SafeRuntime.SafeRagdollBehavior' 'EnrichPendingDeath' `
            'ExtremeRagdoll.SafeRuntime.SafeRagdollBehavior' 'OnMissionTick'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $helper = 'v137src/ExtremeRagdoll/bin/Win64_Shipping_Client/ExtremeRagdoll.ClothSync.dll'
          $baselineMainHash = (Get-FileHash $baseline -Algorithm SHA256).Hash.ToLowerInvariant()
          $baselineHelperHash = (Get-FileHash $helper -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($baselineMainHash -ne 'a822f40a8f58e1b537c3947b976e1bed39850ef93a52f41fe980718bead2105a') { throw "Wrong v1.3.6 baseline main: $baselineMainHash" }
          if ($baselineHelperHash -ne '04a1b4ca8a7f46514a5499ada259b8e9b6af7c4db8ac13d0c8210bd867f028f2') { throw "Wrong v1.3.6 helper: $baselineHelperHash" }
          Copy-Item $helper "$PWD/ExtremeRagdoll.ClothSync.dll"
          Write-Host "v1.3.7 main SHA-256: $((Get-FileHash $output -Algorithm SHA256).Hash.ToLowerInvariant())"
          Write-Host "helper SHA-256: $baselineHelperHash"
      - name: Validate output and unchanged surfaces
        shell: pwsh
        run: |
          $dotnet = (Get-Command dotnet).Source
          $validator = "$PWD/v137build/tools/ValidateAssemblies.dll"
          Copy-Item 'v137src/ExtremeRagdoll/Source/Build/Tools/Mono.Cecil.dll' "$PWD/v137build/tools/Mono.Cecil.dll" -Force
          & $dotnet $validator "$PWD/ExtremeRagdoll.dll" "$PWD/ExtremeRagdoll.ClothSync.dll"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $candidateHelperHash = (Get-FileHash "$PWD/ExtremeRagdoll.ClothSync.dll" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($candidateHelperHash -ne '04a1b4ca8a7f46514a5499ada259b8e9b6af7c4db8ac13d0c8210bd867f028f2') { throw 'Helper changed unexpectedly.' }
      - name: Package compiler output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact | Out-Null
          Copy-Item ExtremeRagdoll.dll artifact/
          Copy-Item ExtremeRagdoll.ClothSync.dll artifact/
          Copy-Item v137src/ExtremeRagdoll/Source/SafeSubModule.cs artifact/
          Copy-Item v137src/ExtremeRagdoll/Source/V1.3.7_FROM_V1.3.6.patch artifact/
          Get-FileHash artifact/* -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Set-Content artifact/SHA256SUMS.txt
          Compress-Archive -Path artifact/* -DestinationPath ExtremeRagdoll-v1.3.7-compiler-output.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ExtremeRagdoll-v1.3.7-compiler-output
          path: ExtremeRagdoll-v1.3.7-compiler-output.zip
